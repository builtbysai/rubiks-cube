<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rubik's Cube · Interactive 3D</title>
<style>
  :root{
    --paper:#f4f0e7;
    --paper-deep:#ebe4d6;
    --surface:rgba(255,253,248,.84);
    --surface-solid:#fffdf8;
    --surface-strong:#ffffff;
    --ink:#211f1a;
    --ink-soft:#726c60;
    --ink-faint:#9a9386;
    --line:rgba(82,72,55,.13);
    --line-strong:rgba(82,72,55,.2);
    --accent:#b71234;
    --shadow-sm:0 8px 24px rgba(55,47,34,.06);
    --shadow-md:0 18px 50px rgba(55,47,34,.09);
    --radius-lg:24px;
    --radius-md:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100dvh;
    height:100dvh;
    overflow:hidden;
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 50% -20%,rgba(255,255,255,.95),transparent 48%),
      linear-gradient(180deg,var(--paper) 0%,var(--paper-deep) 100%);
  }
  button{font:inherit;}

  header{
    width:min(1240px,calc(100% - 32px));
    margin:0 auto;
    padding:14px 2px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  .title{min-width:0;}
  .eyebrow{
    margin-bottom:3px;
    font-size:10px;
    line-height:1;
    font-weight:750;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .title h1{
    margin:0;
    font-size:clamp(20px,2.1vw,28px);
    line-height:1.05;
    letter-spacing:-.035em;
    font-weight:760;
  }
  .title p{
    margin:5px 0 0;
    max-width:620px;
    color:var(--ink-soft);
    font-size:12px;
    line-height:1.35;
  }
  .stats{
    display:flex;
    gap:8px;
    flex:none;
  }
  .stat{
    min-width:72px;
    padding:8px 12px 7px;
    border:1px solid var(--line);
    border-radius:14px;
    background:rgba(255,253,248,.58);
    box-shadow:0 1px 0 rgba(255,255,255,.72) inset;
    text-align:right;
    backdrop-filter:blur(14px);
  }
  .stat .v{
    font-size:18px;
    line-height:1.05;
    font-weight:760;
    letter-spacing:-.025em;
    font-variant-numeric:tabular-nums;
  }
  .stat .k{
    margin-top:3px;
    color:var(--ink-faint);
    font-size:9px;
    line-height:1;
    font-weight:700;
    letter-spacing:.1em;
    text-transform:uppercase;
  }

  #workspace{
    width:min(1240px,calc(100% - 32px));
    min-height:0;
    margin:0 auto;
    padding-bottom:10px;
    display:grid;
    grid-template-columns:minmax(250px,.72fr) minmax(0,1.55fr);
    gap:16px;
    transition:grid-template-columns .24s ease;
  }
  #workspace.orbit-hidden{grid-template-columns:minmax(0,1fr);}

  #stage,
  #orbitPanel{
    min-height:0;
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    background:var(--surface);
    box-shadow:var(--shadow-md);
    backdrop-filter:blur(18px);
  }

  #stage{
    position:relative;
    overflow:hidden;
    isolation:isolate;
    background:
      radial-gradient(circle at 50% 42%,rgba(255,255,255,.92) 0%,rgba(255,253,248,.72) 38%,rgba(239,233,220,.45) 100%);
  }
  #stage::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:
      linear-gradient(rgba(255,255,255,.24),rgba(255,255,255,0) 32%),
      radial-gradient(circle at 50% 110%,rgba(69,61,49,.08),transparent 38%);
  }
  #c{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    cursor:grab;
  }
  #c:active{cursor:grabbing;}

  #orbitPanel{
    position:relative;
    width:100%;
    padding:16px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    overflow:hidden;
    transition:opacity .18s ease,transform .18s ease;
  }
  #orbitPanel::before{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(circle at 50% 46%,rgba(255,255,255,.72),transparent 68%);
  }
  #orbitPanel.hidden{display:none;}
  #orbitTitle{
    position:relative;
    z-index:1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-bottom:2px;
    padding:0 4px;
    color:var(--ink-soft);
    font-size:10px;
    font-weight:760;
    letter-spacing:.11em;
    text-transform:uppercase;
  }
  #orbitTitle span:last-child{
    color:var(--ink-faint);
    font-weight:650;
    letter-spacing:0;
    text-transform:none;
  }
  #orbit{
    position:relative;
    z-index:1;
    width:min(100%,470px);
    max-height:100%;
    aspect-ratio:1;
    height:auto;
    margin:auto;
    display:block;
  }
  #orbitHint{
    position:relative;
    z-index:1;
    margin-top:2px;
    color:var(--ink-faint);
    font-size:10.5px;
    line-height:1.35;
    text-align:center;
  }

  #status{
    position:absolute;
    left:50%;
    bottom:14px;
    z-index:8;
    transform:translateX(-50%) translateY(6px);
    max-width:min(90%,620px);
    padding:8px 13px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:999px;
    background:rgba(29,27,23,.86);
    box-shadow:0 10px 28px rgba(0,0,0,.14);
    color:#fffaf0;
    font-size:12px;
    line-height:1.35;
    text-align:center;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    opacity:0;
    pointer-events:none;
    backdrop-filter:blur(12px);
    transition:opacity .18s ease,transform .18s ease;
  }
  #status.show{opacity:1;transform:translateX(-50%) translateY(0);}

  #win{
    position:absolute;
    inset:0;
    z-index:9;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(244,240,231,.52);
    backdrop-filter:blur(8px);
  }
  #win.show{display:flex;}
  #win .card{
    width:min(90%,360px);
    padding:28px;
    border:1px solid var(--line);
    border-radius:22px;
    background:rgba(255,253,248,.96);
    box-shadow:0 24px 70px rgba(35,32,26,.16);
    text-align:center;
  }
  #win .card h2{margin:0 0 6px;font-size:28px;letter-spacing:-.04em;}
  #win .card p{margin:4px 0 18px;color:var(--ink-soft);font-size:13px;}

  footer{
    width:min(1240px,calc(100% - 32px));
    margin:0 auto;
    padding:0 0 14px;
  }
  .controlShell{
    padding:10px 12px 9px;
    border:1px solid var(--line);
    border-radius:20px;
    background:rgba(255,253,248,.72);
    box-shadow:var(--shadow-sm);
    backdrop-filter:blur(16px);
  }
  .btnrow{
    display:flex;
    justify-content:center;
    gap:7px;
    margin-bottom:8px;
    flex-wrap:wrap;
  }
  button{
    min-height:40px;
    padding:9px 15px;
    border:1px solid var(--line-strong);
    border-radius:12px;
    background:rgba(255,255,255,.7);
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 2px 7px rgba(35,32,26,.05);
    color:var(--ink);
    font-size:13px;
    font-weight:680;
    cursor:pointer;
    transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;
  }
  button:hover{
    background:#fff;
    border-color:rgba(82,72,55,.28);
    box-shadow:0 7px 18px rgba(35,32,26,.08);
    transform:translateY(-1px);
  }
  button:active{transform:translateY(0) scale(.98);}
  button:focus-visible{
    outline:3px solid rgba(183,18,52,.18);
    outline-offset:2px;
    border-color:rgba(183,18,52,.38);
  }
  button.primary{
    border-color:var(--ink);
    background:var(--ink);
    color:#fffaf0;
    box-shadow:0 6px 18px rgba(35,32,26,.15);
  }
  button.primary:hover{background:#343028;border-color:#343028;}
  button:disabled{opacity:.42;cursor:default;transform:none;}
  #btnOrbit[aria-pressed="true"]{
    border-color:rgba(183,18,52,.22);
    background:rgba(183,18,52,.08);
    color:#8f112d;
  }

  .turnsBar{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:0 auto 6px;
    color:var(--ink-faint);
    font-size:9px;
    font-weight:720;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  .turnsBar::before,.turnsBar::after{
    content:"";
    width:28px;
    height:1px;
    background:var(--line-strong);
  }
  #movepad{
    display:grid;
    grid-template-columns:repeat(6,minmax(42px,1fr));
    gap:5px;
    width:min(100%,560px);
    margin:0 auto 7px;
  }
  #movepad button{
    min-height:34px;
    padding:6px 0;
    border-radius:9px;
    font-size:12px;
    font-variant-numeric:tabular-nums;
  }
  .hint{
    padding:0 8px;
    color:var(--ink-soft);
    font-size:10.5px;
    line-height:1.4;
    text-align:center;
  }
  kbd{
    display:inline-flex;
    min-width:20px;
    justify-content:center;
    margin:0 1px;
    padding:1px 5px;
    border:1px solid var(--line-strong);
    border-bottom-width:2px;
    border-radius:5px;
    background:rgba(255,255,255,.65);
    color:var(--ink-soft);
    font:inherit;
    font-size:9px;
  }

  @media (max-width:760px){
    body{grid-template-rows:auto minmax(0,1fr) auto;}
    header{
      width:calc(100% - 20px);
      padding:10px 0 8px;
      gap:10px;
    }
    .eyebrow{display:none;}
    .title h1{font-size:20px;}
    .title p{
      margin-top:3px;
      max-width:240px;
      font-size:10.5px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .stats{gap:5px;}
    .stat{min-width:58px;padding:7px 8px 6px;border-radius:11px;}
    .stat .v{font-size:15px;}
    .stat .k{font-size:8px;}

    #workspace{
      width:calc(100% - 16px);
      padding-bottom:8px;
      grid-template-columns:minmax(0,1fr);
      grid-template-rows:minmax(250px,1fr) 164px;
      gap:8px;
    }
    #workspace.orbit-hidden{grid-template-rows:minmax(0,1fr);}
    #stage{grid-row:1;border-radius:20px;}
    #orbitPanel{
      grid-row:2;
      min-height:0;
      padding:9px 11px;
      border-radius:18px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 142px;
      grid-template-rows:auto 1fr;
      align-items:center;
      column-gap:8px;
    }
    #orbitPanel.hidden{display:none;}
    #orbitTitle{
      grid-column:1;
      grid-row:1;
      align-self:end;
      margin:0 0 4px;
      padding:0;
      font-size:9px;
    }
    #orbitTitle span:last-child{display:none;}
    #orbit{
      grid-column:2;
      grid-row:1 / span 2;
      width:142px;
      max-height:142px;
      margin:auto;
    }
    #orbitHint{
      grid-column:1;
      grid-row:2;
      align-self:start;
      margin:0;
      max-width:180px;
      color:var(--ink-soft);
      font-size:10px;
      text-align:left;
    }

    footer{
      width:calc(100% - 16px);
      padding-bottom:max(8px,env(safe-area-inset-bottom));
    }
    .controlShell{padding:7px 7px 6px;border-radius:16px;}
    .btnrow{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:4px;
      margin-bottom:5px;
    }
    .btnrow button{
      min-height:36px;
      padding:6px 3px;
      border-radius:9px;
      font-size:10.5px;
    }
    .turnsBar{display:none;}
    #movepad{
      gap:3px;
      margin-bottom:0;
      grid-template-columns:repeat(6,minmax(0,1fr));
    }
    #movepad button{
      min-height:31px;
      padding:4px 0;
      font-size:10.5px;
      border-radius:8px;
    }
    .hint{display:none;}
  }

  @media (max-width:420px){
    #workspace{grid-template-rows:minmax(235px,1fr) 148px;}
    #orbitPanel{grid-template-columns:minmax(0,1fr) 126px;}
    #orbit{width:126px;max-height:126px;}
    .title p{max-width:180px;}
  }

  @media (max-height:620px) and (min-width:700px){
    header{
      width:calc(100% - 24px);
      padding:7px 0 6px;
    }
    .eyebrow,.title p{display:none;}
    .title h1{font-size:19px;}
    .stat{padding:5px 9px;}
    #workspace{
      width:calc(100% - 20px);
      grid-template-columns:minmax(170px,.45fr) minmax(0,1.8fr);
      gap:8px;
      padding-bottom:6px;
    }
    #orbitPanel{padding:7px;border-radius:16px;}
    #orbitTitle,#orbitHint{display:none;}
    #orbit{width:min(100%,210px);}
    #stage{border-radius:16px;}
    footer{width:calc(100% - 20px);padding-bottom:6px;}
    .controlShell{padding:5px 7px;}
    .btnrow{margin-bottom:4px;}
    button{min-height:30px;padding:5px 10px;font-size:11px;}
    #movepad{margin-bottom:0;gap:3px;}
    #movepad button{min-height:26px;padding:3px 0;font-size:10px;}
    .turnsBar,.hint{display:none;}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.001ms!important;}
  }

  /* --- polished stage/minimap + guided solve experience --- */
  #workspace{
    position:relative;
    display:block;
    width:min(1180px,calc(100% - 28px));
    min-height:0;
    padding-bottom:10px;
  }
  #workspace.orbit-hidden{display:block;}
  #stage{
    width:100%;
    height:100%;
    min-height:0;
    border-radius:26px;
  }

  #orbitPanel{
    position:absolute;
    z-index:7;
    top:14px;
    left:14px;
    width:clamp(118px,15vw,176px);
    height:auto;
    min-height:0;
    padding:9px;
    display:block;
    border:1px solid rgba(82,72,55,.14);
    border-radius:17px;
    background:rgba(255,253,248,.76);
    box-shadow:0 12px 34px rgba(55,47,34,.09);
    backdrop-filter:blur(18px);
    overflow:hidden;
    transition:opacity .18s ease,transform .18s ease;
  }
  #orbitPanel::before{display:none;}
  #orbitPanel.hidden{
    display:block;
    opacity:0;
    transform:translateY(-6px) scale(.97);
    pointer-events:none;
  }
  #orbitTitle{
    margin:0 0 3px;
    padding:0 1px;
    font-size:8.5px;
    letter-spacing:.12em;
  }
  #orbitTitle span:last-child{display:none;}
  #orbit{
    width:100%;
    max-width:none;
    max-height:none;
    margin:0;
    aspect-ratio:1;
  }
  #orbitHint{display:none;}

  #solveTray{
    position:absolute;
    z-index:10;
    right:14px;
    bottom:14px;
    width:min(430px,calc(100% - 28px));
    padding:14px;
    border:1px solid rgba(82,72,55,.15);
    border-radius:20px;
    background:rgba(255,253,248,.92);
    box-shadow:0 18px 54px rgba(45,38,28,.14);
    backdrop-filter:blur(22px);
    transform-origin:bottom right;
    transition:opacity .18s ease,transform .18s ease;
  }
  #solveTray.hidden{
    opacity:0;
    transform:translateY(10px) scale(.985);
    pointer-events:none;
  }
  .solveHead{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
    margin-bottom:10px;
  }
  .solveEyebrow{
    margin-bottom:3px;
    color:var(--ink-faint);
    font-size:9px;
    font-weight:760;
    letter-spacing:.12em;
    text-transform:uppercase;
  }
  #solveSummary{
    font-size:17px;
    line-height:1.15;
    font-weight:760;
    letter-spacing:-.025em;
  }
  #btnCloseSolve{
    min-height:30px;
    padding:5px 9px;
    border-radius:9px;
    color:var(--ink-soft);
    font-size:11px;
  }
  .solveNowRow{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:7px;
    margin-bottom:9px;
  }
  .solveReadout{
    min-width:0;
    padding:7px 9px;
    border:1px solid var(--line);
    border-radius:11px;
    background:rgba(255,255,255,.54);
  }
  .solveReadout .label{
    display:block;
    margin-bottom:2px;
    color:var(--ink-faint);
    font-size:8px;
    font-weight:720;
    text-transform:uppercase;
    letter-spacing:.09em;
  }
  .solveReadout strong{
    display:block;
    overflow:hidden;
    color:var(--ink);
    font-size:13px;
    line-height:1.1;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  #solveProgressText{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 3px;
    color:var(--ink-soft);
    font-size:10px;
    font-variant-numeric:tabular-nums;
  }
  .solveProgressTrack{
    height:4px;
    margin-bottom:10px;
    overflow:hidden;
    border-radius:999px;
    background:rgba(82,72,55,.10);
  }
  #solveProgressBar{
    width:0%;
    height:100%;
    border-radius:inherit;
    background:var(--ink);
    transition:width .18s ease;
  }
  #solveMoves{
    display:flex;
    gap:5px;
    min-height:36px;
    margin:0 -2px 10px;
    padding:2px 2px 5px;
    overflow-x:auto;
    overscroll-behavior-inline:contain;
    scrollbar-width:thin;
    scroll-snap-type:x proximity;
  }
  .solveMove{
    flex:0 0 auto;
    min-width:34px;
    height:31px;
    display:grid;
    place-items:center;
    padding:0 8px;
    border:1px solid var(--line);
    border-radius:9px;
    background:rgba(255,255,255,.58);
    color:var(--ink-soft);
    font-size:11px;
    font-weight:720;
    scroll-snap-align:center;
    transition:background .15s,border-color .15s,color .15s,transform .15s;
  }
  .solveMove.done{opacity:.42;}
  .solveMove.current{
    border-color:var(--ink);
    background:var(--ink);
    color:#fffaf0;
    transform:translateY(-1px);
  }
  .solveActions{
    display:grid;
    grid-template-columns:1.15fr repeat(4,1fr);
    gap:5px;
  }
  .solveActions button{
    min-height:34px;
    padding:6px 8px;
    border-radius:10px;
    font-size:10.5px;
  }

  @media (max-width:760px){
    #workspace{
      width:calc(100% - 16px);
      display:block;
      padding-bottom:8px;
    }
    #stage{height:100%;border-radius:20px;}
    #orbitPanel{
      top:9px;
      left:9px;
      width:108px;
      padding:7px;
      border-radius:14px;
    }
    #orbitTitle{font-size:7.5px;margin-bottom:1px;}
    #solveTray{
      position:absolute;
      left:8px;
      right:8px;
      bottom:8px;
      width:auto;
      padding:11px;
      border-radius:17px;
      transform-origin:bottom center;
    }
    .solveNowRow{grid-template-columns:1fr 1fr;}
    #solveProgressText{grid-column:1 / -1;justify-content:flex-start;padding:0 2px;}
    .solveActions{grid-template-columns:1.2fr repeat(4,1fr);}
    .solveActions button{padding:5px 4px;font-size:9.5px;}
  }

  @media (max-height:620px) and (min-width:700px){
    #workspace{display:block;width:calc(100% - 20px);}
    #orbitPanel{width:108px;top:8px;left:8px;padding:6px;}
    #solveTray{width:390px;right:8px;bottom:8px;padding:10px;}
  }

  /* === HUD + fixed minimap + action dock refinement === */
  body{
    grid-template-rows:auto minmax(0,1fr) auto;
  }

  .topbar{
    width:min(1180px,calc(100% - 28px));
    min-height:62px;
    margin:0 auto;
    padding:10px 2px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    min-width:0;
  }
  .brandIcon{
    width:30px;
    height:30px;
    flex:none;
    fill:none;
    stroke:var(--ink);
    stroke-width:1.45;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .brandText h1{
    margin:0;
    font-size:17px;
    line-height:1.05;
    letter-spacing:-.025em;
    font-weight:760;
  }
  .brandText span{
    display:block;

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------------------------------- model ---------------------------------- */

const FACE_COLORS = { U:0xffffff, D:0xffd500, F:0x009b48, B:0x0046ad, R:0xb71234, L:0xff5800 };

// Face order for the solver string is URFDLB. Each entry: outward normal n,
// screen-up u and screen-right r when looking straight at the face.
const FACES = [
  { id:'U', n:[ 0, 1, 0], u:[ 0, 0,-1], r:[ 1, 0, 0] },
  { id:'R', n:[ 1, 0, 0], u:[ 0, 1, 0], r:[ 0, 0,-1] },
  { id:'F', n:[ 0, 0, 1], u:[ 0, 1, 0], r:[ 1, 0, 0] },
  { id:'D', n:[ 0,-1, 0], u:[ 0, 0, 1], r:[ 1, 0, 0] },
  { id:'L', n:[-1, 0, 0], u:[ 0, 1, 0], r:[ 0, 0, 1] },
  { id:'B', n:[ 0, 0,-1], u:[ 0, 1, 0], r:[-1, 0, 0] },
];

// Every facelet slot also has a cube-space surface position and normal.
// The orbit uses this to rotate the complete 54-sticker projection when the
// viewer turns the whole cube from one face to another.
const FACELET_GEOMETRY = [];
const FACELET_INDEX_BY_GEOMETRY = new Map();
for (let fi=0; fi<FACES.length; fi++){
  const f=FACES[fi];
  for (let row=0; row<3; row++) for (let col=0; col<3; col++){
    const up=1-row, right=col-1;
    const p=[
      f.n[0] + up*f.u[0] + right*f.r[0],
      f.n[1] + up*f.u[1] + right*f.r[1],
      f.n[2] + up*f.u[2] + right*f.r[2],
    ];
    const n=[...f.n];
    const idx=fi*9+row*3+col;
    FACELET_GEOMETRY[idx]={p,n};
    FACELET_INDEX_BY_GEOMETRY.set(p.join(',')+'|'+n.join(','),idx);
  }
}

const _viewVecP = new THREE.Vector3();
const _viewVecN = new THREE.Vector3();
const _viewAxis = new THREE.Vector3();
const _viewAxisQ = new THREE.Quaternion();

function axisQuaternion(axis, angle, target=new THREE.Quaternion()){
  _viewAxis.set(0,0,0); _viewAxis[axis]=1;
  return target.setFromAxisAngle(_viewAxis,angle);
}

function buildViewSlotPermutation(q){
  const perm=new Array(54);
  for (let i=0; i<54; i++){
    const g=FACELET_GEOMETRY[i];
    _viewVecP.set(...g.p).applyQuaternion(q).set(
      Math.round(_viewVecP.x),Math.round(_viewVecP.y),Math.round(_viewVecP.z)
    );
    _viewVecN.set(...g.n).applyQuaternion(q).set(
      Math.round(_viewVecN.x),Math.round(_viewVecN.y),Math.round(_viewVecN.z)
    );
    const key=[_viewVecP.x,_viewVecP.y,_viewVecP.z].join(',')+'|'+
      [_viewVecN.x,_viewVecN.y,_viewVecN.z].join(',');
    const dest=FACELET_INDEX_BY_GEOMETRY.get(key);
    if (dest === undefined) throw new Error('Invalid view orientation');
    perm[i]=dest;
  }
  return perm;
}

function applyViewPermutation(ids, perm){
  const out=new Array(54);
  for (let i=0; i<54; i++) out[perm[i]]=ids[i];
  return out;
}

function orientMoveForView(move, q){
  _viewAxis.set(0,0,0); _viewAxis[move.axis]=1;
  _viewAxis.applyQuaternion(q);
  const ax=Math.abs(_viewAxis.x)>.5?'x':Math.abs(_viewAxis.y)>.5?'y':'z';
  const sign=Math.sign(_viewAxis[ax]) || 1;
  return {
    ...move,
    axis:ax,
    dir:(move.dir || 1)*sign,
    layer:move.layer === undefined ? move.layer : move.layer*sign
  };
}

function localAxisForVisualAxis(visualAxis, desiredDir){
  // At a snapped view orientation, exactly one local cube axis maps to each
  // visual X/Y/Z axis. This keeps horizontal swipes rotating around whichever
  // face is currently "up", even after the cube has been pitched.
  for(const localAxis of ['x','y','z']){
    _viewAxis.set(0,0,0); _viewAxis[localAxis]=1;
    _viewAxis.applyQuaternion(viewOrientationQ);
    const mapped=Math.abs(_viewAxis.x)>.5?'x':Math.abs(_viewAxis.y)>.5?'y':'z';
    if(mapped!==visualAxis) continue;
    const sign=Math.sign(_viewAxis[visualAxis]) || 1;
    return {axis:localAxis,dir:desiredDir*sign};
  }
  return {axis:visualAxis,dir:desiredDir};
}

// Standard Singmaster notation mapped to {axis, layer, dir}.
// dir is the sign of a quarter turn about the positive axis; a prime flips it.
const MOVES = {
  R:{axis:'x', layer: 1, dir:-1}, L:{axis:'x', layer:-1, dir: 1},
  U:{axis:'y', layer: 1, dir:-1}, D:{axis:'y', layer:-1, dir: 1},
  F:{axis:'z', layer: 1, dir:-1}, B:{axis:'z', layer:-1, dir: 1},
};

function parseMove(token){
  const base = MOVES[token[0]];
  let dir = base.dir, turns = 1;
  if (token.includes("'")) dir = -dir;
  if (token.includes('2')) turns = 2;
  return { axis:base.axis, layer:base.layer, dir, turns };
}

/* ---------------------------------- scene ---------------------------------- */

const canvas = document.getElementById('c');
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfc0, 0.95));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4.5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight(0xfff2dd, 0.5);
rim.position.set(-6, 3, -5);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ opacity: 0.16 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -2.85;
ground.receiveShadow = true;
scene.add(ground);

const viewGroup = new THREE.Group();   // user orbits this
const cubeGroup = new THREE.Group();   // cubies live here, axis aligned
viewGroup.add(cubeGroup);
scene.add(viewGroup);

const bodyGeo = new RoundedBoxGeometry(0.96, 0.96, 0.96, 4, 0.07);
const bodyMat = new THREE.MeshStandardMaterial({ color:0x17171b, roughness:0.35, metalness:0.15 });
const stickerGeo = new THREE.PlaneGeometry(0.82, 0.82);

function buildCube(){
  while (cubeGroup.children.length) {
    const c = cubeGroup.children.pop();
    c.traverse(o => { if (o.isMesh && o.material !== bodyMat) o.material.dispose(); });
  }
  for (let x=-1; x<=1; x++) for (let y=-1; y<=1; y++) for (let z=-1; z<=1; z++){
    const cubie = new THREE.Group();
    cubie.position.set(x, y, z);
    cubie.userData.pos = new THREE.Vector3(x, y, z);
    cubie.userData.stickers = [];
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true;
    cubie.add(body);
    for (const f of FACES){
      const n = f.n;
      const px = x*n[0], py = y*n[1], pz = z*n[2];
      if (px + py + pz !== 1) continue;   // sticker only where this cubie touches face f
      const m = new THREE.Mesh(
        stickerGeo,
        new THREE.MeshStandardMaterial({ color:FACE_COLORS[f.id], roughness:0.28, metalness:0.05 })
      );
      m.position.set(n[0]*0.485, n[1]*0.485, n[2]*0.485);
      m.lookAt(n[0]*2, n[1]*2, n[2]*2);
      m.userData.dir = new THREE.Vector3(n[0], n[1], n[2]); // home direction (cube space)
      m.userData.home = f.id;
      // Permanent ID equals this physical sticker's solved URFDLB facelet slot.
      const fi = FACES.indexOf(f);
      const row = 1 - (x*f.u[0] + y*f.u[1] + z*f.u[2]);
      const col = 1 + (x*f.r[0] + y*f.r[1] + z*f.r[2]);
      m.userData.orbitId = fi*9 + row*3 + col;
      cubie.add(m);
      cubie.userData.stickers.push(m);
    }
    cubeGroup.add(cubie);
  }
}
buildCube();

/* ------------------------------ view controls ------------------------------ */

// Fixed isometric presentation. All user-visible orientation changes go
// through viewOrientationQ so the 3D cube and 2D orbit can never disagree.
let yaw = -0.62, pitch = 0.46;
let targetYaw = -0.62, targetPitch = 0.46;
let zoomFactor = 1.0, targetZoomFactor = 1.0;

// Whole-cube viewing orientation. The reference does not leave the 2D
// projection frozen while the 3D cube turns: all 54 stickers transition to
// the next face orientation. We keep the resting orientation on exact
// quarter-turns so every endpoint is a valid orbit node.
const viewOrientationQ = new THREE.Quaternion();
let viewSlotPermutation = buildViewSlotPermutation(viewOrientationQ);
let viewDrag = null;  // direct manipulation between two face orientations
let viewSnap = null;  // release animation to 0° or 90°
const VIEW_DRAG_PX = 170;
const _baseViewEuler = new THREE.Euler(0,0,0,'XYZ');
const _baseViewQ = new THREE.Quaternion();
const _displayOrientationQ = new THREE.Quaternion();
const _stepViewQ = new THREE.Quaternion();

const pointers = new Map();
let downInfo = null;   // sticker drag or whole-cube view drag
let pinch = null;

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const _q = new THREE.Quaternion();

function cubeLocalNormal(worldNormal){
  cubeGroup.getWorldQuaternion(_q).invert();
  const n = worldNormal.clone().applyQuaternion(_q);
  const ax = Math.abs(n.x) > 0.5 ? 'x' : Math.abs(n.y) > 0.5 ? 'y' : 'z';
  const v = new THREE.Vector3();
  v[ax] = Math.sign(n[ax]);
  return v;
}

function pick(e){
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(cubeGroup.children, true);
  for (const h of hits){
    if (!h.object.userData.home) continue;   // stickers only; body gaps mean orbit
    let o = h.object;
    while (o && !o.userData.pos) o = o.parent;
    if (!o) continue;
    const wn = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    return { cubie:o, normal:cubeLocalNormal(wn) };
  }
  return null;
}

function orientedStickerIds(ids=faceletStickerIds(), perm=viewSlotPermutation){
  return applyViewPermutation(ids,perm);
}

function startViewDrag(axis, dir, startX, startY){
  if (viewDrag || viewSnap || active || layerDrag || queue.length || inputLocked()) return false;

  const oldIds=orientedStickerIds();
  axisQuaternion(axis,dir*Math.PI/2,_stepViewQ);
  const targetQ=viewOrientationQ.clone().multiply(_stepViewQ);
  const targetPerm=buildViewSlotPermutation(targetQ);
  const newIds=orientedStickerIds(faceletStickerIds(),targetPerm);

  const logicalMove={axis,dir,turns:1,whole:true};
  const visualMove=orientMoveForView(logicalMove,viewOrientationQ);
  viewDrag={
    axis,dir,startX,startY,angle:0,
    screenAxis:visualMove.axis==='y'?'horizontal':'vertical',
    screenDir:visualMove.dir,
    targetQ,targetPerm,visualMove,
    dotMap:buildDragDotMap(oldIds,newIds,visualMove),
  };
  return true;
}

function updateViewDrag(curX,curY){
  if(!viewDrag) return;
  const delta=viewDrag.screenAxis==='horizontal'
    ? curX-viewDrag.startX
    : curY-viewDrag.startY;
  const progress=Math.max(0,Math.min(1,(delta*viewDrag.screenDir)/VIEW_DRAG_PX));
  viewDrag.angle=viewDrag.dir*progress*Math.PI/2;
}

function finishViewDrag(){
  if(!viewDrag) return;
  const startAngle=viewDrag.angle || 0;
  const progress=Math.abs(startAngle)/(Math.PI/2);
  const commit=progress>=0.5;
  const targetAngle=commit ? viewDrag.dir*Math.PI/2 : 0;
  const remaining=Math.abs(targetAngle-startAngle)/(Math.PI/2);
  viewSnap={
    ...viewDrag,
    startAngle,targetAngle,displayAngle:startAngle,
    commit,t:0,dur:Math.max(0.10,0.44*remaining),
  };
  viewDrag=null;
}

function currentViewProgress(source){
  if(!source) return 0;
  return Math.max(0,Math.min(1,
    source.angle !== undefined
      ? source.angle/(source.dir*Math.PI/2)
      : source.displayAngle/(source.dir*Math.PI/2)
  ));
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), zoomFactor:targetZoomFactor };
    viewDrag = null;
    downInfo = null;
    return;
  }
  if (pointers.size > 2) return;
  const hit = pick(e);
  if (hit && !inputLocked()) downInfo = { sx:e.clientX, sy:e.clientY, ...hit, decided:false };
  else downInfo = { sx:e.clientX, sy:e.clientY, orbit:true };
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const dxAll = e.clientX - prev.x, dyAll = e.clientY - prev.y;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if (pinch && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if (d > 10) targetZoomFactor = Math.min(2.5, Math.max(0.5, pinch.zoomFactor * pinch.d / d));
    return;
  }
  if (!downInfo) return;
  const dx = e.clientX - downInfo.sx, dy = e.clientY - downInfo.sy;

  if (downInfo.orbit){
    if (viewSnap || active || layerDrag || queue.length || inputLocked()) return;
    if (!viewDrag){
      if (Math.hypot(dx,dy) < 3) return;
      const horizontal=Math.abs(dx)>=Math.abs(dy);
      const signed=horizontal?dx:dy;
      const desiredDir=Math.sign(signed) || 1;
      const turn=localAxisForVisualAxis(horizontal?'y':'x',desiredDir);
      if (!startViewDrag(turn.axis,turn.dir,downInfo.sx,downInfo.sy)) return;
    }
    updateViewDrag(e.clientX,e.clientY);
    return;
  }
  // Slow-drag layer twisting (Hans: tactile, not snap)
  if (layerDrag){
    updateLayerDrag(e.clientX, e.clientY);
    return;
  }
  if (downInfo.decided || Math.hypot(dx, dy) < 3) return;
  // Start a layer drag instead of snapping
  if (busy() || inputLocked()) return;
  const turn = computeTurn(dx, dy);
  if (!turn) return;
  startLayerDrag(turn, downInfo.sx, downInfo.sy);
  updateLayerDrag(e.clientX, e.clientY);
  downInfo.decided = true;
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0){
    if (layerDrag) finishLayerDrag();
    else if (viewDrag) finishViewDrag();
    downInfo = null;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetZoomFactor = Math.min(2.5, Math.max(0.5, targetZoomFactor * (1 + e.deltaY*0.001)));
}, { passive:false });

// Compute which layer turn a drag means: the in-plane axis most aligned with
// the drag, then the rotation that carries the grabbed point along the drag.
// Returns {axis, layer, dir, dragDirX, dragDirY} or null.
function computeTurn(dx, dy){
  const n = downInfo.normal;
  const center = downInfo.cubie.getWorldPosition(new THREE.Vector3());
  cubeGroup.getWorldQuaternion(_q);
  let best = null;
  for (const a of ['x','y','z']){
    if (Math.abs(n[a]) > 0.5) continue;
    const v = new THREE.Vector3(); v[a] = 1;
    const vw = v.clone().applyQuaternion(_q);
    const p0 = center.clone().project(camera);
    const p1 = center.clone().add(vw).project(camera);
    const sx = p1.x - p0.x, sy = -(p1.y - p0.y);
    const len = Math.hypot(sx, sy);
    if (len < 1e-6) continue;
    const dot = (dx*sx + dy*sy) / (Math.hypot(dx, dy) * len);
    if (!best || Math.abs(dot) > Math.abs(best.dot)) best = { axis:a, dot, sx, sy, len };
  }
  if (!best) return null;
  const vv = new THREE.Vector3(); vv[best.axis] = Math.sign(best.dot);
  const omega = new THREE.Vector3().crossVectors(n, vv); // n x t: grabbed point moves along t
  const axis = Math.abs(omega.x) > 0.5 ? 'x' : Math.abs(omega.y) > 0.5 ? 'y' : 'z';
  // Drag direction in screen space (normalized)
  const dragLen = Math.hypot(dx, dy);
  return {
    axis, layer:Math.round(downInfo.cubie.userData.pos[axis]),
    dir:Math.sign(omega[axis]),
    dragDirX: dx/dragLen, dragDirY: dy/dragLen,
  };
}
// Legacy: decide and enqueue (for buttons/keyboard)
function decideTurn(dx, dy){
  const t = computeTurn(dx, dy);
  if (!t) return;
  enqueueMove({axis:t.axis, layer:t.layer, dir:t.dir, turns:1, duration:500, record:true});
  noteActivity();
}
// Start a slow-drag: create pivot, attach cubies, track drag
function startLayerDrag(turn, startX, startY){
  // Capture the orbit's exact settled starting state BEFORE the nine cubies
  // are reparented into the temporary rotation pivot. Once reparented they are
  // no longer direct cubeGroup children, so taking this snapshot afterward
  // made the drag map intermittently incomplete.
  let oldState=null;
  try { oldState=orientedStickerIds(faceletStickerIds()); } catch(err) {}

  const pivot = new THREE.Group();
  cubeGroup.add(pivot);
  const cubies = [];
  for (const ch of cubeGroup.children){
    if (ch === pivot || !ch.userData.pos) continue;
    if (Math.round(ch.userData.pos[turn.axis]) === turn.layer) cubies.push(ch);
  }
  for (const ch of cubies) pivot.add(ch);

  layerDrag = {
    pivot,cubies,axis:turn.axis,layer:turn.layer,dir:turn.dir,
    startX,startY,dirX:turn.dragDirX,dirY:turn.dragDirY,currentAngle:0,
    pathAngle:turn.dir*Math.PI/2
  };

  try {
    if(!oldState) throw new Error('No pre-drag orbit state');

    // Compute the exact quarter-turn destination while keeping the visible
    // pivot at zero. This destination plus the live pivot angle gives us a
    // deterministic continuous path for every intermediate drag position.
    const savedActive=active;
    let newState;
    try{
      active={axis:turn.axis,angle:turn.dir*Math.PI/2,cubies};
      newState=orientedStickerIds(faceletStickerIds());
    }finally{
      active=savedActive;
    }

    const visualMove=orientMoveForView(
      {axis:turn.axis,layer:turn.layer,dir:turn.dir,turns:1},
      viewOrientationQ
    );

    layerDrag.oldState=oldState;
    layerDrag.newState=newState;
    layerDrag.visualMove=visualMove;
    layerDrag.dotMap=buildDragDotMap(oldState,newState,visualMove);
  } catch(err) {
    layerDrag.dotMap=null;
    console.warn('Orbit drag mapping failed',err);
  }
}

// Build mapping of dot movements for a drag: matches dots between old and new states
function shortestAngleDelta(a0,a1){
  let d=a1-a0;
  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;
  return d;
}

function orbitDirectionForPaths(rawPaths, move){
  if(move.orbitDirection) return Math.sign(move.orbitDirection) || 1;
  let positiveCost=0, negativeCost=0;
  for(const p of rawPaths){
    const d=shortestAngleDelta(p.a0,p.a1);
    positiveCost += d >= 0 ? d : d + Math.PI*2;
    negativeCost += d <= 0 ? -d : Math.PI*2 - d;
  }
  return positiveCost <= negativeCost ? 1 : -1;
}

function directedAngleDelta(a0,a1,direction){
  const tau=Math.PI*2;
  let d=a1-a0;
  if(direction>0){
    while(d<0)d+=tau;
    while(d>=tau)d-=tau;
  }else{
    while(d>0)d-=tau;
    while(d<=-tau)d+=tau;
  }
  return d;
}

// Reference behavior has two distinct face-turn paths:
// 1) 12 adjacent-strip stickers ride the active gray circle EXACTLY.
// 2) 8 stickers on the rotating face move through the radial space between
//    rings while their angle rotates around that same axis center.
// Keeping these separate prevents track stickers from visibly drifting off the
// drawn circle while preserving the measured face-perimeter motion.
function buildTrackPath(raw,direction,activeRadius){
  return {
    kind:'track',
    cx:raw.center[0],cy:raw.center[1],
    r:activeRadius,
    a0:raw.a0,
    da:directedAngleDelta(raw.a0,raw.a1,direction),
    direction
  };
}

function buildRadialPath(raw){
  return {
    kind:'radial',
    cx:raw.center[0],cy:raw.center[1],
    r0:raw.r0,r1:raw.r1,
    a0:raw.a0,
    da:shortestAngleDelta(raw.a0,raw.a1)
  };
}

function nearestOrbitRadiusInfo(r,radii){
  let index=0,error=Math.abs(r-radii[0]);
  for(let i=1;i<radii.length;i++){
    const e=Math.abs(r-radii[i]);
    if(e<error){index=i;error=e;}
  }
  return {index,radius:radii[index],error};
}

// Whole-cube rotation is exactly three simultaneous slice turns around one
// axis. That gives the reference's real motion classes:
//  - 12 points on each of the three active-axis rings = 36 track-locked
//  - 8 perimeter points on each opposite axis-facing face = 16 radial
//  - 2 face centers remain fixed and therefore do not appear in the map
function buildWholeViewPaths(raw,move,g){
  const tolerance=Math.max(0.75,g.S*0.0035);

  const classified=raw.map(p=>{
    const start=nearestOrbitRadiusInfo(p.r0,g.radii);
    const end=nearestOrbitRadiusInfo(p.r1,g.radii);
    const onTrack=
      start.index===end.index &&
      start.error<=tolerance &&
      end.error<=tolerance;
    return {...p,onTrack,ringIndex:onTrack?start.index:null};
  });

  const trackRaw=classified.filter(p=>p.onTrack);
  const direction=orbitDirectionForPaths(trackRaw.length?trackRaw:classified,move);

  return classified.map(p=>({
    dot:p.dot,
    oldX:p.oldSlot.x,oldY:p.oldSlot.y,
    newX:p.newSlot.x,newY:p.newSlot.y,
    path:p.onTrack
      ? {
          kind:'viewTrack',
          cx:p.center[0],cy:p.center[1],
          r:g.radii[p.ringIndex],
          ringIndex:p.ringIndex,
          a0:p.a0,
          da:directedAngleDelta(p.a0,p.a1,direction),
          direction
        }
      : {
          kind:'viewRadial',
          cx:p.center[0],cy:p.center[1],
          r0:p.r0,r1:p.r1,
          a0:p.a0,
          da:shortestAngleDelta(p.a0,p.a1)
        }
  }));
}

function orbitPoint(m,t){
  t=Math.max(0,Math.min(1,t));
  const p=m.path;
  if(!p) return {x:m.oldX+(m.newX-m.oldX)*t,y:m.oldY+(m.newY-m.oldY)*t};

  if(p.kind==='track' || p.kind==='viewTrack'){
    // Track paths never change radius. Their centers ride the gray circle line
    // from the very first pixel of the gesture through the endpoint.
    const a=p.a0+p.da*t;
    return {x:p.cx+Math.cos(a)*p.r,y:p.cy+Math.sin(a)*p.r};
  }

  if(p.kind==='radial' || p.kind==='viewRadial'){
    // Axis-facing face-perimeter points rotate exactly like the radial points
    // of a normal face twist. These are the only whole-view points that move
    // between the three rings.
    const r=p.r0+(p.r1-p.r0)*t;
    const a=p.a0+p.da*t;
    return {x:p.cx+Math.cos(a)*r,y:p.cy+Math.sin(a)*r};
  }

  return {x:m.oldX+(m.newX-m.oldX)*t,y:m.oldY+(m.newY-m.oldY)*t};
}

function normalizedTurnProgress(angle,quarterAngle){
  if(!quarterAngle) return 0;
  return Math.max(0,Math.min(1,angle/quarterAngle));
}

function buildDragDotMap(oldIds,newIds,move){
  const slotMap=getOrbitSlotMap();
  if(!slotMap || slotMap.length!==54 || !orbitDots || orbitDots.length!==54) return null;

  const oldSlotById=new Map(), newSlotById=new Map();
  for(const {slot,globalIdx} of slotMap){
    oldSlotById.set(oldIds[globalIdx],slot);
    newSlotById.set(newIds[globalIdx],slot);
  }

  const g=getOrbitGeometry();
  const family=ORBIT_FAMILY_FOR_AXIS[move.axis];
  const center=g.centers[family];
  const raw=[];

  for(const dot of orbitDots){
    const oldSlot=oldSlotById.get(dot.id), newSlot=newSlotById.get(dot.id);
    if(!oldSlot || !newSlot) continue;
    if(Math.hypot(oldSlot.x-newSlot.x,oldSlot.y-newSlot.y)<0.01) continue;

    const x0=oldSlot.x-center[0], y0=oldSlot.y-center[1];
    const x1=newSlot.x-center[0], y1=newSlot.y-center[1];
    raw.push({
      dot,oldSlot,newSlot,center,
      r0:Math.hypot(x0,y0),
      r1:Math.hypot(x1,y1),
      a0:Math.atan2(y0,x0),
      a1:Math.atan2(y1,x1)
    });
  }

  if(move.whole){
    return buildWholeViewPaths(raw,move,g);
  }

  const ringIndex=ORBIT_COORD_TO_RING(move.layer ?? 0);
  const activeRadius=g.radii[ringIndex];
  const tolerance=Math.max(0.75,g.S*0.0035);

  // Only the 12 strip stickers are supposed to be constrained to the active
  // track. Pick their shared sweep direction as a group.
  const trackRaw=raw.filter(p =>
    Math.abs(p.r0-activeRadius)<=tolerance &&
    Math.abs(p.r1-activeRadius)<=tolerance
  );
  const trackDirection=orbitDirectionForPaths(trackRaw.length?trackRaw:raw,move);

  return raw.map(p => {
    const onTrack=
      Math.abs(p.r0-activeRadius)<=tolerance &&
      Math.abs(p.r1-activeRadius)<=tolerance;

    return {
      dot:p.dot,
      oldX:p.oldSlot.x,oldY:p.oldSlot.y,
      newX:p.newSlot.x,newY:p.newSlot.y,
      path:onTrack
        ? buildTrackPath(p,trackDirection,activeRadius)
        : buildRadialPath(p)
    };
  });
}

// Update layer drag from current pointer position
function updateLayerDrag(curX, curY){
  if (!layerDrag) return;
  const dx = curX - layerDrag.startX, dy = curY - layerDrag.startY;
  // Project drag onto the turn direction
  const dist = dx*layerDrag.dirX + dy*layerDrag.dirY;
  // 155px drag = 90 degrees. The orbit reads this exact angle on the same frame.
  const progress = Math.max(0, Math.min(1, dist / 155));
  const angle = layerDrag.dir * progress * (Math.PI/2);
  layerDrag.currentAngle = angle;
  // Direct manipulation: no secondary smoothing state. The 3D layer transform
  // is the source of truth that the orbit reads on the same frame.
  layerDrag.pivot.rotation[layerDrag.axis] = angle;
}
// Finish layer drag: snap to nearest 90deg, animate, then settle
function finishLayerDrag(){
  if (!layerDrag) return;
  const {pivot, cubies, axis, dir, currentAngle} = layerDrag;
  // Snap to nearest 90 degrees
  const dragAngle=currentAngle || 0;
  const quarterTurns = Math.abs(dragAngle) >= Math.PI/4 ? Math.sign(dragAngle) : 0;
  const targetAngle = quarterTurns * (Math.PI/2);
  const actualTurns = Math.abs(quarterTurns);
  // If snapped to 0 (no meaningful turn), just put cubies back
  if (actualTurns === 0){
    const dragOrbitMap = layerDrag.dotMap;
    const startAngle = layerDrag.pivot.rotation[axis] || currentAngle || 0;
    const returnDur=Math.max(0.10,0.50*Math.min(1,Math.abs(startAngle)/(Math.PI/2)));
    active = {pivot, cubies, axis, angle:0, t:0, dur:returnDur,
              move:{axis, layer:layerDrag.layer, dir, turns:0, duration:returnDur*1000, record:false},
              fromAngle:startAngle, isDragFinish:true, isCancelledDrag:true,
              orbitMap:dragOrbitMap, orbitStartAngle:startAngle, orbitBaseAngle:(layerDrag.pathAngle || Math.sign(startAngle||1)*Math.PI/2)};
    layerDrag = null;
    return;
  }
  // Animate from current to target, then finish as a move
  const startAngle = layerDrag.pivot.rotation[axis] || currentAngle || 0;
  const remaining=Math.abs(targetAngle-startAngle)/(Math.PI/2);
  const finishDur=Math.max(0.10,0.50*Math.min(1,remaining));
  const move = {axis, layer:layerDrag.layer, dir:Math.sign(quarterTurns), turns:actualTurns, duration:finishDur*1000, record:true};
  // Continue from the exact angle already visible on screen.
  const dragOrbitMap = layerDrag.dotMap;
  active = {pivot, cubies, axis, angle:targetAngle, t:0, dur:finishDur, move,
            fromAngle:startAngle, isDragFinish:true, orbitMap:dragOrbitMap, orbitStartAngle:startAngle, orbitBaseAngle:(layerDrag.pathAngle || targetAngle || Math.PI/2)};
  layerDrag = null;
  noteActivity();
}

/* ------------------------------- move engine ------------------------------- */

const queue = [];
let active = null;      // {pivot, cubies, axis, angle, t, dur, move}
let layerDrag = null;   // {pivot, cubies, axis, layer, dir, startX, startY, dirX, dirY} for slow-drag
const history = [];
let solving = false;    // solver playback in progress
let solverBusy = false; // solver thinking (worker)
let suppressWin = false;
let solveToken = 0;

let solutionGuide = {
  tokens:[],
  index:0,
  playing:false,
  busy:false,
  originalFacelets:'',
};

function inputLocked(){ return solving || solverBusy || solutionGuide.playing || solutionGuide.busy; }
function busy(){ return active || layerDrag || viewDrag || viewSnap || queue.length > 0; }

function enqueueMove(m){
  // A 180° turn is two visible quarter turns in the reference. Expanding it
  // keeps every sticker on the same polar rule instead of asking one shortcut
  // interpolation to guess a half-turn path.
  if (m.turns === 2 && !m._quarterPart){
    const historyEntry = { ...m };
    queue.push({
      ...m, turns:1, record:false, count:false, _quarterPart:true,
      onComplete:null
    });
    queue.push({
      ...m, turns:1, record:!!m.record, count:true, historyEntry, _quarterPart:true
    });
    return;
  }
  queue.push(m);
}

const _axisV = new THREE.Vector3();
const _tmpV = new THREE.Vector3();

function startMove(m){
  // Capture the physical sticker permutation before reparenting the layer.
  const oldIds = orientedStickerIds(faceletStickerIds());
  const pivot = new THREE.Group();
  cubeGroup.add(pivot);
  const cubies = [];
  for (const c of cubeGroup.children){
    if (c === pivot || !c.userData.pos) continue;
    if (Math.round(c.userData.pos[m.axis]) === m.layer) cubies.push(c);
  }
  for (const c of cubies) pivot.add(c);

  const angle = m.dir*m.turns*Math.PI/2;
  const savedActive = active;
  active = {axis:m.axis, angle, cubies};
  const newIds = orientedStickerIds(faceletStickerIds());
  active = savedActive;
  const visualMove=orientMoveForView(m,viewOrientationQ);
  const orbitMap = buildDragDotMap(oldIds,newIds,visualMove);

  active = { pivot, cubies, axis:m.axis, angle, t:0, dur:(m.duration || 500)/1000, move:m,
             orbitMap, orbitStartAngle:0 };
}

function settleCubies(cubies, angle){
  _axisV.set(0,0,0);
  _axisV[active ? active.axis : 'x'] = 1;
  const q = new THREE.Quaternion().setFromAxisAngle(_axisV, angle);
  for (const c of cubies){
    _tmpV.copy(c.userData.pos).applyQuaternion(q);
    _tmpV.set(Math.round(_tmpV.x), Math.round(_tmpV.y), Math.round(_tmpV.z));
    c.userData.pos.copy(_tmpV);
    c.position.copy(_tmpV);
    c.quaternion.premultiply(q);
    cubeGroup.add(c);
  }
}

function finishMove(){
  const finished = active;
  const { pivot, cubies, move } = finished;
  settleCubies(cubies, finished.angle);
  cubeGroup.remove(pivot);
  active = null;
  if (!finished.isCancelledDrag && move.count !== false){
    moveCount++;
    movesEl.textContent = moveCount;
    if (move.record) history.push(move.historyEntry || move);
  }
  if (typeof move.onComplete === 'function') move.onComplete();
  afterMove();
}

// Instant (unanimated) turn, used by tests.
function applyInstant(m){
  const cubies = [];
  for (const c of cubeGroup.children){
    if (!c.userData.pos) continue;
    if (Math.round(c.userData.pos[m.axis]) === m.layer) cubies.push(c);
  }
  const keep = active; active = { axis:m.axis };
  settleCubies(cubies, m.dir*m.turns*Math.PI/2);
  active = keep;
  if (m.record) history.push(m);
}

function afterMove(){
  if (solutionGuide.playing) return;
  if (suppressWin){
    if (!busy()) suppressWin = false;   // scramble drained
    return;
  }
  if (!busy() && isSolved()){
    stopTimer();
    if (solving){
      solving = false;
      showWin('The solver found the way home.');
    } else {
      showWin();
    }
  }
}

const easeInOut = k => 0.5 - 0.5*Math.cos(Math.PI*k); // reference-like scripted sweep
const easeOutCubic = k => 1 - Math.pow(1-k,3);         // tactile release: no dead stop before completion

/* ------------------------------ cube state --------------------------------- */

const _n = new THREE.Vector3(), _u = new THREE.Vector3(), _r = new THREE.Vector3(), _d = new THREE.Vector3();

const _lq = new THREE.Quaternion();
// Every cubie with its logical (settled) position/orientation. While a turn is
// animating, the in-flight layer gets its pending rotation applied, so state
// readers (facelets, isSolved) stay correct mid-animation instead of crashing.
function logicalCubies(){
  const out = [];
  let sq = null;
  if (active){
    _axisV.set(0,0,0); _axisV[active.axis] = 1;
    sq = new THREE.Quaternion().setFromAxisAngle(_axisV, active.angle);
  }
  for (const c of cubeGroup.children){
    if (!c.userData.pos) continue;
    out.push({ c, pos:c.userData.pos, quat:c.quaternion });
  }
  if (active) for (const c of active.cubies){
    _tmpV.copy(c.userData.pos).applyQuaternion(sq);
    _tmpV.set(Math.round(_tmpV.x), Math.round(_tmpV.y), Math.round(_tmpV.z));
    _lq.copy(sq).multiply(c.quaternion);
    out.push({ c, pos:_tmpV.clone(), quat:_lq.clone() });
  }
  return out;
}

function facelets(){
  const cubies = logicalCubies();
  let s = '';
  for (const f of FACES){
    _n.set(...f.n); _u.set(...f.u); _r.set(...f.r);
    for (let row=0; row<3; row++) for (let col=0; col<3; col++){
      let cubie = null;
      for (const e of cubies){
        const p = e.pos;
        if (Math.round(p.dot(_n)) === 1 && Math.round(p.dot(_u)) === 1-row && Math.round(p.dot(_r)) === col-1){ cubie = e; break; }
      }
      let home = '?';
      for (const st of cubie.c.userData.stickers){
        _d.copy(st.userData.dir).applyQuaternion(cubie.quat);
        if (_d.dot(_n) > 0.9){ home = st.userData.home; break; }
      }
      s += home;
    }
  }
  return s;
}

// Stable physical-sticker permutation in the same URFDLB slot order as facelets().
function faceletStickerIds(){
  const cubies = logicalCubies();
  const ids = [];
  for (const f of FACES){
    _n.set(...f.n); _u.set(...f.u); _r.set(...f.r);
    for (let row=0; row<3; row++) for (let col=0; col<3; col++){
      let cubie = null;
      for (const e of cubies){
        const p = e.pos;
        if (Math.round(p.dot(_n)) === 1 && Math.round(p.dot(_u)) === 1-row && Math.round(p.dot(_r)) === col-1){ cubie = e; break; }
      }
      let id = -1;
      if (cubie) for (const st of cubie.c.userData.stickers){
        _d.copy(st.userData.dir).applyQuaternion(cubie.quat);
        if (_d.dot(_n) > 0.9){ id = st.userData.orbitId; break; }
      }
      ids.push(id);
    }
  }
  return ids;
}

function isSolved(){
  const s = facelets();
  for (let i=0; i<6; i++){
    const block = s.slice(i*9, i*9+9);
    if (!block.split('').every(ch => ch === block[0])) return false;
  }
  return true;
}

/* ------------------------------ solver ------------------------------------- */
// Kociemba's two-phase algorithm (via the vendored cubejs library): a guided
// search through the cube's state graph, usually about 20 moves. It runs in a
// Web Worker so the one-time table build never freezes the page.

let solverWorker = null, solverReady = false, solverWaiters = [];

function getSolver(){
  return new Promise(resolve => {
    if (solverWorker && solverReady) return resolve(solverWorker);
    solverWaiters.push(resolve);
    if (solverWorker) return;
    const base = window.__VENDOR_BASE || new URL('vendor/', document.baseURI).href;
    const src =
      "importScripts('" + base + "cube.js','" + base + "solve.js');\n" +
      "Cube.initSolver();\n" +
      "postMessage({type:'ready'});\n" +
      "onmessage=function(e){\n" +
      "  try{ postMessage({type:'solution', sol:Cube.fromString(e.data.facelets).solve()}); }\n" +
      "  catch(err){ postMessage({type:'error', message:String(err)}); }\n" +
      "};";
    try {
      solverWorker = new Worker(URL.createObjectURL(new Blob([src], { type:'text/javascript' })));
    } catch(err){ solverWorker = null; }
    if (!solverWorker){ finishWaiters(null); return; }
    solverWorker.onmessage = e => {
      if (e.data.type === 'ready'){ solverReady = true; finishWaiters(solverWorker); }
      else if (solverWaiters._solve){ const cb = solverWaiters._solve; solverWaiters._solve = null; cb(e.data.sol || ''); }
    };
    solverWorker.onerror = () => {
      if (!solverReady){ solverWorker = null; finishWaiters(null); }
      else if (solverWaiters._solve){ const cb = solverWaiters._solve; solverWaiters._solve = null; cb(''); }
    };
    function finishWaiters(w){ const ws = solverWaiters; solverWaiters = []; ws.forEach(r => r(w)); }
  });
}

function solveInWorker(faceletsStr){
  return new Promise(async resolve => {
    const w = await getSolver();
    if (!w){ // worker unavailable: solve on the main thread
      try {
        if (typeof Cube !== 'undefined'){
          Cube.initSolver();
          resolve(Cube.fromString(faceletsStr).solve());
          return;
        }
      } catch(e){}
      resolve('');
      return;
    }
    solverWaiters._solve = resolve;
    setTimeout(() => { if (solverWaiters._solve){ const cb = solverWaiters._solve; solverWaiters._solve = null; cb(''); } }, 30000);
    w.postMessage({ facelets:faceletsStr });
  });
}

function inverseToken(token){
  if(token.includes('2')) return token;
  return token.includes("'") ? token[0] : token[0] + "'";
}

function normalizeSolutionTokens(solution){
  // cubejs already returns compact Singmaster notation. This lightweight pass
  // removes adjacent same-face redundancies so the guide is easier to read.
  const out=[];
  const amount=t=>t.includes('2')?2:t.includes("'")?3:1;
  const encode=(face,n)=>{
    n=((n%4)+4)%4;
    if(n===0) return null;
    if(n===1) return face;
    if(n===2) return face+'2';
    return face+"'";
  };
  for(const raw of solution.trim().split(/\s+/)){
    if(!raw) continue;
    const token=raw.toUpperCase();
    const last=out[out.length-1];
    if(last && last[0]===token[0]){
      out.pop();
      const merged=encode(token[0],amount(last)+amount(token));
      if(merged) out.push(merged);
    }else out.push(token);
  }
  return out;
}

const solveTray=document.getElementById('solveTray');
const solveSummary=document.getElementById('solveSummary');
const solveNowEl=document.getElementById('solveNow');
const solveNextEl=document.getElementById('solveNext');

function renderSolutionGuide(){
  const {tokens,index,playing,busy}=solutionGuide;
  const total=tokens.length;
  solveSummary.textContent=total ? total+' move'+(total===1?'':'s')+' to solved' : 'Ready';
  solveNowEl.textContent=index<total ? tokens[index] : 'Solved';
  solveNextEl.textContent=index+1<total ? tokens[index+1] : '—';
  solveProgressText.textContent=Math.min(index,total)+' / '+total;
  solveProgressBar.style.width=(total ? Math.min(100,index/total*100) : 0)+'%';
  solveTray.classList.toggle('complete',total>0 && index>=total);
  btnSolvePlay.textContent=playing ? 'Pause' : (index>=total ? 'Replay' : 'Play');
  btnSolvePrev.disabled=busy || index<=0;
  btnSolveNext.disabled=busy || index>=total;
  btnSolveRestart.disabled=busy || index<=0;
  btnCopySolve.disabled=!total;

  const active=solveMovesEl.children[index];
  for(let i=0;i<solveMovesEl.children.length;i++){
    const el=solveMovesEl.children[i];
    el.classList.toggle('done',i<index);
    el.classList.toggle('current',i===index);
  }
  if(active) active.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

function openSolutionGuide(tokens){
  solutionGuide.tokens=tokens;
  solutionGuide.index=0;
  solutionGuide.playing=false;
  solutionGuide.busy=false;
  solutionGuide.originalFacelets=facelets();
  solveMovesEl.replaceChildren();
  tokens.forEach((token,i)=>{
    const chip=document.createElement('div');
    chip.className='solveMove';
    chip.textContent=token;
    chip.dataset.index=i;
    chip.title='Move '+(i+1)+': '+token;
    chip.addEventListener('click',async()=>{
      if(solutionGuide.playing || solutionGuide.busy) return;
      const target=i;
      while(solutionGuide.index<target){
        const ok=await stepSolutionForward();
        if(!ok) break;
      }
      while(solutionGuide.index>target){
        const ok=await stepSolutionBack();
        if(!ok) break;
      }
      renderSolutionGuide();
    });
    solveMovesEl.appendChild(chip);
  });
  solveTray.classList.remove('hidden');
  renderSolutionGuide();
}

function closeSolutionGuide(){
  solutionGuide.playing=false;
  solutionGuide.busy=false;
  solving=false;
  solveTray.classList.add('hidden');
  renderSolutionGuide();
}

function runGuideMove(token,direction=1){
  if(solutionGuide.busy || busy()) return Promise.resolve(false);
  solutionGuide.busy=true;
  renderSolutionGuide();
  const actual=direction>0 ? token : inverseToken(token);
  return new Promise(resolve=>{
    const m={...parseMove(actual),duration:430,record:false,count:false};
    m.onComplete=()=>{
      solutionGuide.busy=false;
      renderSolutionGuide();
      resolve(true);
    };
    enqueueMove(m);
  });
}

async function stepSolutionForward(){
  if(solutionGuide.index>=solutionGuide.tokens.length) return false;
  const token=solutionGuide.tokens[solutionGuide.index];
  const ok=await runGuideMove(token,1);
  if(ok){
    solutionGuide.index++;
    renderSolutionGuide();
  }
  return ok;
}

async function stepSolutionBack(){
  if(solutionGuide.index<=0) return false;
  const token=solutionGuide.tokens[solutionGuide.index-1];
  const ok=await runGuideMove(token,-1);
  if(ok){
    solutionGuide.index--;
    renderSolutionGuide();
  }
  return ok;
}

async function playSolution(){
  if(!solutionGuide.tokens.length) return;
  if(solutionGuide.playing){
    solutionGuide.playing=false;
    solving=false;
    renderSolutionGuide();
    return;
  }
  if(solutionGuide.index>=solutionGuide.tokens.length){
    // Replay means rewind through the guide first, preserving the actual cube.
    while(solutionGuide.index>0) await stepSolutionBack();
  }
  solutionGuide.playing=true;
  solving=true;
  renderSolutionGuide();
  restartTimer();
  while(solutionGuide.playing && solutionGuide.index<solutionGuide.tokens.length){
    const ok=await stepSolutionForward();
    if(!ok) break;
  }
  solutionGuide.playing=false;
  solving=false;
  renderSolutionGuide();
  if(solutionGuide.index>=solutionGuide.tokens.length && isSolved()){
    stopTimer();
    showWin('Solution complete.');
  }
}

async function restartSolutionGuide(){
  if(solutionGuide.busy) return;
  solutionGuide.playing=false;
  solving=false;
  while(solutionGuide.index>0){
    const ok=await stepSolutionBack();
    if(!ok) break;
  }
  renderSolutionGuide();
}

async function doSolve(){
  if (inputLocked() || busy()) return;
  const token = ++solveToken;
  const s = facelets();
  if (isSolved()){ showStatus('Already solved. Give it a scramble first.'); return; }
  hideWin();
  solverBusy = true;
  const solveButton=document.getElementById('btnSolve');
  const solveButtonLabel=solveButton.querySelector('span');
  solveButton.disabled=true;
  if(solveButtonLabel) solveButtonLabel.textContent='Solving…';
  showStatus(solverReady ? 'Finding a solution…' : 'Preparing the solver…', true);
  const sol = await solveInWorker(s);
  if (token !== solveToken){
    solverBusy=false;
    solveButton.disabled=false;
    if(solveButtonLabel) solveButtonLabel.textContent='Solve';
    return;
  }
  solverBusy = false;
  solveButton.disabled=false;
  if(solveButtonLabel) solveButtonLabel.textContent='Solve';
  if (!sol || !sol.trim()){
    showStatus('No solution returned. Try again.');
    return;
  }
  const tokens=normalizeSolutionTokens(sol);
  hideStatus();
  openSolutionGuide(tokens);
}
