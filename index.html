<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rubik's Cube · Interactive 3D</title>
<style>
  :root{
    --paper:#f6f1e7;
    --paper2:#efe8d8;
    --ink:#23201a;
    --ink-soft:#6b6455;
    --accent:#b71234;
    --card:#fffdf8;
    --line:#e2d9c4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--paper) 0%,var(--paper2) 100%);
    display:grid;
    grid-template-rows:auto minmax(0,1fr) auto;
    height:100dvh;
    overflow:hidden;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px 8px;
    max-width:900px; width:100%; margin:0 auto;
  }
  .title h1{margin:0; font-size:22px; letter-spacing:.5px;}
  .title p{margin:2px 0 0; font-size:12px; color:var(--ink-soft);}
  .stats{display:flex; gap:18px; text-align:right;}
  .stat .v{font-size:20px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat .k{font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--ink-soft);}
  #stage{position:relative; min-height:0;}
  #c{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab;}
  #c:active{cursor:grabbing;}
  #status{
    position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    max-width:min(92%,640px);
    background:rgba(35,32,26,.85); color:#f6f1e7;
    font-size:12.5px; line-height:1.45;
    padding:8px 14px; border-radius:999px;
    opacity:0; transition:opacity .25s; pointer-events:none;
    text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #status.show{opacity:1;}
  #win{
    position:absolute; inset:0; display:none;
    align-items:center; justify-content:center;
    background:rgba(246,241,231,.55); backdrop-filter:blur(3px);
    z-index:5;
  }
  #win.show{display:flex;}
  #win .card{
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:28px 36px; text-align:center; box-shadow:0 18px 50px rgba(35,32,26,.18);
  }
  #win .card h2{margin:0 0 6px; font-size:28px;}
  #win .card p{margin:4px 0 16px; color:var(--ink-soft); font-size:14px;}
  footer{
    max-width:900px; width:100%; margin:0 auto; padding:6px 18px 14px;
  }
  .btnrow{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:10px;}
  button{
    font:inherit; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer;
    box-shadow:0 2px 6px rgba(35,32,26,.08);
    transition:transform .06s, box-shadow .15s, background .15s;
  }
  button:hover{background:#fff; box-shadow:0 4px 12px rgba(35,32,26,.12);}
  button:active{transform:scale(.96);}
  button.primary{background:var(--ink); color:#f6f1e7; border-color:var(--ink);}
  button.primary:hover{background:#3a352a;}
  button:disabled{opacity:.45; cursor:default; transform:none;}
  #movepad{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; max-width:520px; margin:0 auto 8px;}
  #movepad button{padding:8px 0; font-size:13px; border-radius:9px;}
  .hint{text-align:center; font-size:11.5px; color:var(--ink-soft); line-height:1.5; padding:0 8px;}
  kbd{background:#e9e2d2; border:1px solid #d6cbae; border-radius:4px; padding:0 5px; font-size:11px; font-family:inherit;}
  @media (max-width:560px){
    .title h1{font-size:18px;}
    .title p{font-size:11px;}
    .stat .v{font-size:16px;}
    button{padding:9px 14px; font-size:13px;}
  }
  /* Compact mode for short viewports (landscape phones): shrink chrome, hide the
     hint, and give the stage as much height as possible. */
  @media (max-height: 540px){
    #app{ padding:8px 14px; gap:6px; }
    header h1{ font-size:19px; }
    header p{ display:none; }
    .stats{ font-size:16px; gap:16px; }
    .stats small{ font-size:9px; }
    #toolbar{ gap:6px; margin-top:2px; }
    #toolbar button{ padding:6px 10px; font-size:13px; border-radius:10px; }
    #movepad{ gap:4px; margin-top:6px; max-width:520px; }
    #movepad button{ padding:5px 0; font-size:12px; border-radius:8px; }
    .hint{ display:none; }
    footer{ gap:0; }
    #status{ font-size:12px; padding:6px 12px; top:8px; }
  }
  /* Orbit diagram: floats over the stage, synced with the cube. */
  #orbitPanel{
    position:absolute; left:clamp(10px,4vw,52px); top:50%; width:min(42vw,520px); z-index:5;
    transform:translateY(-50%);
    background:transparent; border:0; border-radius:0;
    box-shadow:none; padding:0;
    transition:opacity .25s, transform .25s;
  }
  #orbitPanel.hidden{ opacity:0; transform:translateY(calc(-50% + 10px)); pointer-events:none; }
  #orbitTitle{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-soft); padding:0 8px 2px; opacity:.72;
  }
  #orbitTitle span:last-child{ font-weight:600; letter-spacing:0; text-transform:none; }
  #orbit{ width:100%; aspect-ratio:1/1; height:auto; display:block; }
  #orbitHint{ display:none; }
  #btnOrbit[aria-pressed="true"]{ background:#e9e2d2; }
  @media (max-width:720px){
    #orbitPanel{ width:min(52vw,220px); left:6px; top:auto; bottom:52px; transform:none; }
    #orbitPanel.hidden{ transform:translateY(10px); }
    #orbitTitle{ font-size:9px; padding-left:4px; }
  }
  @media (max-height: 540px){
    #orbitPanel{ width:min(36vw,230px); bottom:4px; }
  }
</style>

<body>

<header>
  <div class="title">
    <h1>Rubik's Cube</h1>
    <p>Interactive 3D &middot; Kociemba two-phase solver inside</p>
  </div>
  <div class="stats">
    <div class="stat"><div class="v" id="time">0:00</div><div class="k">Time</div></div>
    <div class="stat"><div class="v" id="moves">0</div><div class="k">Moves</div></div>
  </div>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div id="status"></div>
  <div id="orbitPanel">
    <div id="orbitTitle"><span>Orbits</span><span id="orbitCount"></span></div>
    <canvas id="orbit"></canvas>
    <div id="orbitHint">54 stickers &middot; live projection</div>
  </div>
  <div id="win">
    <div class="card">
      <h2>Solved</h2>
      <p id="winDetail"></p>
      <button class="primary" id="winScramble">New scramble</button>

  </div>
</div>

<footer>
  <div class="btnrow">
    <button id="btnScramble" class="primary">Scramble</button>
    <button id="btnSolve">Solve</button>
    <button id="btnUndo">Undo</button>
    <button id="btnReset">Reset</button>
    <button id="btnOrbit" aria-pressed="true">Orbits</button>
  </div>
  <div id="movepad"></div>
  <div class="hint">
    Drag a sticker to turn that layer &middot; drag the background to rotate face-to-face &middot; scroll or pinch to zoom<br>
    Keys <kbd>R</kbd><kbd>L</kbd><kbd>U</kbd><kbd>D</kbd><kbd>F</kbd><kbd>B</kbd> turn faces, hold <kbd>Shift</kbd> for counter-clockwise
  </div>
</footer>

<script src="vendor/cube.js"></script>
<script src="vendor/solve.js"></script>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------------------------------- model ---------------------------------- */

const FACE_COLORS = { U:0xffffff, D:0xffd500, F:0x009b48, B:0x0046ad, R:0xb71234, L:0xff5800 };

// Face order for the solver string is URFDLB. Each entry: outward normal n,
// screen-up u and screen-right r when looking straight at the face.
const FACES = [
  { id:'U', n:[ 0, 1, 0], u:[ 0, 0,-1], r:[ 1, 0, 0] },
  { id:'R', n:[ 1, 0, 0], u:[ 0, 1, 0], r:[ 0, 0,-1] },
  { id:'F', n:[ 0, 0, 1], u:[ 0, 1, 0], r:[ 1, 0, 0] },
  { id:'D', n:[ 0,-1, 0], u:[ 0, 0, 1], r:[ 1, 0, 0] },
  { id:'L', n:[-1, 0, 0], u:[ 0, 1, 0], r:[ 0, 0, 1] },
  { id:'B', n:[ 0, 0,-1], u:[ 0, 1, 0], r:[-1, 0, 0] },
];

// Every facelet slot also has a cube-space surface position and normal.
// The orbit uses this to rotate the complete 54-sticker projection when the
// viewer turns the whole cube from one face to another.
const FACELET_GEOMETRY = [];
const FACELET_INDEX_BY_GEOMETRY = new Map();
for (let fi=0; fi<FACES.length; fi++){
  const f=FACES[fi];
  for (let row=0; row<3; row++) for (let col=0; col<3; col++){
    const up=1-row, right=col-1;
    const p=[
      f.n[0] + up*f.u[0] + right*f.r[0],
      f.n[1] + up*f.u[1] + right*f.r[1],
      f.n[2] + up*f.u[2] + right*f.r[2],
    ];
    const n=[...f.n];
    const idx=fi*9+row*3+col;
    FACELET_GEOMETRY[idx]={p,n};
    FACELET_INDEX_BY_GEOMETRY.set(p.join(',')+'|'+n.join(','),idx);
  }
}

const _viewVecP = new THREE.Vector3();
const _viewVecN = new THREE.Vector3();
const _viewAxis = new THREE.Vector3();
const _viewAxisQ = new THREE.Quaternion();

function axisQuaternion(axis, angle, target=new THREE.Quaternion()){
  _viewAxis.set(0,0,0); _viewAxis[axis]=1;
  return target.setFromAxisAngle(_viewAxis,angle);
}

function buildViewSlotPermutation(q){
  const perm=new Array(54);
  for (let i=0; i<54; i++){
    const g=FACELET_GEOMETRY[i];
    _viewVecP.set(...g.p).applyQuaternion(q).set(
      Math.round(_viewVecP.x),Math.round(_viewVecP.y),Math.round(_viewVecP.z)
    );
    _viewVecN.set(...g.n).applyQuaternion(q).set(
      Math.round(_viewVecN.x),Math.round(_viewVecN.y),Math.round(_viewVecN.z)
    );
    const key=[_viewVecP.x,_viewVecP.y,_viewVecP.z].join(',')+'|'+
      [_viewVecN.x,_viewVecN.y,_viewVecN.z].join(',');
    const dest=FACELET_INDEX_BY_GEOMETRY.get(key);
    if (dest === undefined) throw new Error('Invalid view orientation');
    perm[i]=dest;
  }
  return perm;
}

function applyViewPermutation(ids, perm){
  const out=new Array(54);
  for (let i=0; i<54; i++) out[perm[i]]=ids[i];
  return out;
}

function orientMoveForView(move, q){
  _viewAxis.set(0,0,0); _viewAxis[move.axis]=1;
  _viewAxis.applyQuaternion(q);
  const ax=Math.abs(_viewAxis.x)>.5?'x':Math.abs(_viewAxis.y)>.5?'y':'z';
  const sign=Math.sign(_viewAxis[ax]) || 1;
  return {
    ...move,
    axis:ax,
    dir:(move.dir || 1)*sign,
    layer:move.layer === undefined ? move.layer : move.layer*sign
  };
}

function localAxisForVisualAxis(visualAxis, desiredDir){
  // At a snapped view orientation, exactly one local cube axis maps to each
  // visual X/Y/Z axis. This keeps horizontal swipes rotating around whichever
  // face is currently "up", even after the cube has been pitched.
  for(const localAxis of ['x','y','z']){
    _viewAxis.set(0,0,0); _viewAxis[localAxis]=1;
    _viewAxis.applyQuaternion(viewOrientationQ);
    const mapped=Math.abs(_viewAxis.x)>.5?'x':Math.abs(_viewAxis.y)>.5?'y':'z';
    if(mapped!==visualAxis) continue;
    const sign=Math.sign(_viewAxis[visualAxis]) || 1;
    return {axis:localAxis,dir:desiredDir*sign};
  }
  return {axis:visualAxis,dir:desiredDir};
}

// Standard Singmaster notation mapped to {axis, layer, dir}.
// dir is the sign of a quarter turn about the positive axis; a prime flips it.
const MOVES = {
  R:{axis:'x', layer: 1, dir:-1}, L:{axis:'x', layer:-1, dir: 1},
  U:{axis:'y', layer: 1, dir:-1}, D:{axis:'y', layer:-1, dir: 1},
  F:{axis:'z', layer: 1, dir:-1}, B:{axis:'z', layer:-1, dir: 1},
};

function parseMove(token){
  const base = MOVES[token[0]];
  let dir = base.dir, turns = 1;
  if (token.includes("'")) dir = -dir;
  if (token.includes('2')) turns = 2;
  return { axis:base.axis, layer:base.layer, dir, turns };
}

/* ---------------------------------- scene ---------------------------------- */

const canvas = document.getElementById('c');
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0xd8cfc0, 0.95));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(4.5, 8, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
key.shadow.radius = 4;
scene.add(key);
const rim = new THREE.DirectionalLight(0xfff2dd, 0.5);
rim.position.set(-6, 3, -5);
scene.add(rim);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.ShadowMaterial({ opacity: 0.16 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -2.85;
ground.receiveShadow = true;
scene.add(ground);

const viewGroup = new THREE.Group();   // user orbits this
const cubeGroup = new THREE.Group();   // cubies live here, axis aligned
viewGroup.add(cubeGroup);
scene.add(viewGroup);

const bodyGeo = new RoundedBoxGeometry(0.96, 0.96, 0.96, 4, 0.07);
const bodyMat = new THREE.MeshStandardMaterial({ color:0x17171b, roughness:0.35, metalness:0.15 });
const stickerGeo = new THREE.PlaneGeometry(0.82, 0.82);

function buildCube(){
  while (cubeGroup.children.length) {
    const c = cubeGroup.children.pop();
    c.traverse(o => { if (o.isMesh && o.material !== bodyMat) o.material.dispose(); });
  }
  for (let x=-1; x<=1; x++) for (let y=-1; y<=1; y++) for (let z=-1; z<=1; z++){
    const cubie = new THREE.Group();
    cubie.position.set(x, y, z);
    cubie.userData.pos = new THREE.Vector3(x, y, z);
    cubie.userData.stickers = [];
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true;
    cubie.add(body);
    for (const f of FACES){
      const n = f.n;
      const px = x*n[0], py = y*n[1], pz = z*n[2];
      if (px + py + pz !== 1) continue;   // sticker only where this cubie touches face f
      const m = new THREE.Mesh(
        stickerGeo,
        new THREE.MeshStandardMaterial({ color:FACE_COLORS[f.id], roughness:0.28, metalness:0.05 })
      );
      m.position.set(n[0]*0.485, n[1]*0.485, n[2]*0.485);
      m.lookAt(n[0]*2, n[1]*2, n[2]*2);
      m.userData.dir = new THREE.Vector3(n[0], n[1], n[2]); // home direction (cube space)
      m.userData.home = f.id;
      // Permanent ID equals this physical sticker's solved URFDLB facelet slot.
      const fi = FACES.indexOf(f);
      const row = 1 - (x*f.u[0] + y*f.u[1] + z*f.u[2]);
      const col = 1 + (x*f.r[0] + y*f.r[1] + z*f.r[2]);
      m.userData.orbitId = fi*9 + row*3 + col;
      cubie.add(m);
      cubie.userData.stickers.push(m);
    }
    cubeGroup.add(cubie);
  }
}
buildCube();

/* ------------------------------ view controls ------------------------------ */

// Fixed isometric presentation. All user-visible orientation changes go
// through viewOrientationQ so the 3D cube and 2D orbit can never disagree.
let yaw = -0.62, pitch = 0.46;
let targetYaw = -0.62, targetPitch = 0.46;
let zoomFactor = 1.0, targetZoomFactor = 1.0;

// Whole-cube viewing orientation. The reference does not leave the 2D
// projection frozen while the 3D cube turns: all 54 stickers transition to
// the next face orientation. We keep the resting orientation on exact
// quarter-turns so every endpoint is a valid orbit node.
const viewOrientationQ = new THREE.Quaternion();
let viewSlotPermutation = buildViewSlotPermutation(viewOrientationQ);
let viewDrag = null;  // direct manipulation between two face orientations
let viewSnap = null;  // release animation to 0° or 90°
const VIEW_DRAG_PX = 170;
const _baseViewEuler = new THREE.Euler(0,0,0,'XYZ');
const _baseViewQ = new THREE.Quaternion();
const _displayOrientationQ = new THREE.Quaternion();
const _stepViewQ = new THREE.Quaternion();

const pointers = new Map();
let downInfo = null;   // sticker drag or whole-cube view drag
let pinch = null;

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const _q = new THREE.Quaternion();

function cubeLocalNormal(worldNormal){
  cubeGroup.getWorldQuaternion(_q).invert();
  const n = worldNormal.clone().applyQuaternion(_q);
  const ax = Math.abs(n.x) > 0.5 ? 'x' : Math.abs(n.y) > 0.5 ? 'y' : 'z';
  const v = new THREE.Vector3();
  v[ax] = Math.sign(n[ax]);
  return v;
}

function pick(e){
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left)/r.width)*2 - 1, -((e.clientY - r.top)/r.height)*2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(cubeGroup.children, true);
  for (const h of hits){
    if (!h.object.userData.home) continue;   // stickers only; body gaps mean orbit
    let o = h.object;
    while (o && !o.userData.pos) o = o.parent;
    if (!o) continue;
    const wn = h.face.normal.clone().transformDirection(h.object.matrixWorld);
    return { cubie:o, normal:cubeLocalNormal(wn) };
  }
  return null;
}

function orientedStickerIds(ids=faceletStickerIds(), perm=viewSlotPermutation){
  return applyViewPermutation(ids,perm);
}

function startViewDrag(axis, dir, startX, startY){
  if (viewDrag || viewSnap || active || layerDrag || queue.length || inputLocked()) return false;

  const oldIds=orientedStickerIds();
  axisQuaternion(axis,dir*Math.PI/2,_stepViewQ);
  const targetQ=viewOrientationQ.clone().multiply(_stepViewQ);
  const targetPerm=buildViewSlotPermutation(targetQ);
  const newIds=orientedStickerIds(faceletStickerIds(),targetPerm);

  const logicalMove={axis,dir,turns:1,whole:true};
  const visualMove=orientMoveForView(logicalMove,viewOrientationQ);
  viewDrag={
    axis,dir,startX,startY,angle:0,
    screenAxis:visualMove.axis==='y'?'horizontal':'vertical',
    screenDir:visualMove.dir,
    targetQ,targetPerm,visualMove,
    dotMap:buildDragDotMap(oldIds,newIds,visualMove),
  };
  return true;
}

function updateViewDrag(curX,curY){
  if(!viewDrag) return;
  const delta=viewDrag.screenAxis==='horizontal'
    ? curX-viewDrag.startX
    : curY-viewDrag.startY;
  const progress=Math.max(0,Math.min(1,(delta*viewDrag.screenDir)/VIEW_DRAG_PX));
  viewDrag.angle=viewDrag.dir*progress*Math.PI/2;
}

function finishViewDrag(){
  if(!viewDrag) return;
  const startAngle=viewDrag.angle || 0;
  const progress=Math.abs(startAngle)/(Math.PI/2);
  const commit=progress>=0.5;
  const targetAngle=commit ? viewDrag.dir*Math.PI/2 : 0;
  const remaining=Math.abs(targetAngle-startAngle)/(Math.PI/2);
  viewSnap={
    ...viewDrag,
    startAngle,targetAngle,displayAngle:startAngle,
    commit,t:0,dur:Math.max(0.10,0.44*remaining),
  };
  viewDrag=null;
}

function currentViewProgress(source){
  if(!source) return 0;
  return Math.max(0,Math.min(1,
    source.angle !== undefined
      ? source.angle/(source.dir*Math.PI/2)
      : source.displayAngle/(source.dir*Math.PI/2)
  ));
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2){
    const [a, b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), zoomFactor:targetZoomFactor };
    viewDrag = null;
    downInfo = null;
    return;
  }
  if (pointers.size > 2) return;
  const hit = pick(e);
  if (hit && !inputLocked()) downInfo = { sx:e.clientX, sy:e.clientY, ...hit, decided:false };
  else downInfo = { sx:e.clientX, sy:e.clientY, orbit:true };
});

canvas.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  const dxAll = e.clientX - prev.x, dyAll = e.clientY - prev.y;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

  if (pinch && pointers.size >= 2){
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if (d > 10) targetZoomFactor = Math.min(2.5, Math.max(0.5, pinch.zoomFactor * pinch.d / d));
    return;
  }
  if (!downInfo) return;
  const dx = e.clientX - downInfo.sx, dy = e.clientY - downInfo.sy;

  if (downInfo.orbit){
    if (viewSnap || active || layerDrag || queue.length || inputLocked()) return;
    if (!viewDrag){
      if (Math.hypot(dx,dy) < 3) return;
      const horizontal=Math.abs(dx)>=Math.abs(dy);
      const signed=horizontal?dx:dy;
      const desiredDir=Math.sign(signed) || 1;
      const turn=localAxisForVisualAxis(horizontal?'y':'x',desiredDir);
      if (!startViewDrag(turn.axis,turn.dir,downInfo.sx,downInfo.sy)) return;
    }
    updateViewDrag(e.clientX,e.clientY);
    return;
  }
  // Slow-drag layer twisting (Hans: tactile, not snap)
  if (layerDrag){
    updateLayerDrag(e.clientX, e.clientY);
    return;
  }
  if (downInfo.decided || Math.hypot(dx, dy) < 3) return;
  // Start a layer drag instead of snapping
  if (busy() || inputLocked()) return;
  const turn = computeTurn(dx, dy);
  if (!turn) return;
  startLayerDrag(turn, downInfo.sx, downInfo.sy);
  updateLayerDrag(e.clientX, e.clientY);
  downInfo.decided = true;
});

function endPointer(e){
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0){
    if (layerDrag) finishLayerDrag();
    else if (viewDrag) finishViewDrag();
    downInfo = null;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetZoomFactor = Math.min(2.5, Math.max(0.5, targetZoomFactor * (1 + e.deltaY*0.001)));
}, { passive:false });

// Compute which layer turn a drag means: the in-plane axis most aligned with
// the drag, then the rotation that carries the grabbed point along the drag.
// Returns {axis, layer, dir, dragDirX, dragDirY} or null.
function computeTurn(dx, dy){
  const n = downInfo.normal;
  const center = downInfo.cubie.getWorldPosition(new THREE.Vector3());
  cubeGroup.getWorldQuaternion(_q);
  let best = null;
  for (const a of ['x','y','z']){
    if (Math.abs(n[a]) > 0.5) continue;
    const v = new THREE.Vector3(); v[a] = 1;
    const vw = v.clone().applyQuaternion(_q);
    const p0 = center.clone().project(camera);
    const p1 = center.clone().add(vw).project(camera);
    const sx = p1.x - p0.x, sy = -(p1.y - p0.y);
    const len = Math.hypot(sx, sy);
    if (len < 1e-6) continue;
    const dot = (dx*sx + dy*sy) / (Math.hypot(dx, dy) * len);
    if (!best || Math.abs(dot) > Math.abs(best.dot)) best = { axis:a, dot, sx, sy, len };
  }
  if (!best) return null;
  const vv = new THREE.Vector3(); vv[best.axis] = Math.sign(best.dot);
  const omega = new THREE.Vector3().crossVectors(n, vv); // n x t: grabbed point moves along t
  const axis = Math.abs(omega.x) > 0.5 ? 'x' : Math.abs(omega.y) > 0.5 ? 'y' : 'z';
  // Drag direction in screen space (normalized)
  const dragLen = Math.hypot(dx, dy);
  return {
    axis, layer:Math.round(downInfo.cubie.userData.pos[axis]),
    dir:Math.sign(omega[axis]),
    dragDirX: dx/dragLen, dragDirY: dy/dragLen,
  };
}
// Legacy: decide and enqueue (for buttons/keyboard)
function decideTurn(dx, dy){
  const t = computeTurn(dx, dy);
  if (!t) return;
  enqueueMove({axis:t.axis, layer:t.layer, dir:t.dir, turns:1, duration:500, record:true});
  noteActivity();
}
// Start a slow-drag: create pivot, attach cubies, track drag
function startLayerDrag(turn, startX, startY){
  // Capture the orbit's exact settled starting state BEFORE the nine cubies
  // are reparented into the temporary rotation pivot. Once reparented they are
  // no longer direct cubeGroup children, so taking this snapshot afterward
  // made the drag map intermittently incomplete.
  let oldState=null;
  try { oldState=orientedStickerIds(faceletStickerIds()); } catch(err) {}

  const pivot = new THREE.Group();
  cubeGroup.add(pivot);
  const cubies = [];
  for (const ch of cubeGroup.children){
    if (ch === pivot || !ch.userData.pos) continue;
    if (Math.round(ch.userData.pos[turn.axis]) === turn.layer) cubies.push(ch);
  }
  for (const ch of cubies) pivot.add(ch);

  layerDrag = {
    pivot,cubies,axis:turn.axis,layer:turn.layer,dir:turn.dir,
    startX,startY,dirX:turn.dragDirX,dirY:turn.dragDirY,currentAngle:0,
    pathAngle:turn.dir*Math.PI/2
  };

  try {
    if(!oldState) throw new Error('No pre-drag orbit state');

    // Compute the exact quarter-turn destination while keeping the visible
    // pivot at zero. This destination plus the live pivot angle gives us a
    // deterministic continuous path for every intermediate drag position.
    const savedActive=active;
    let newState;
    try{
      active={axis:turn.axis,angle:turn.dir*Math.PI/2,cubies};
      newState=orientedStickerIds(faceletStickerIds());
    }finally{
      active=savedActive;
    }

    const visualMove=orientMoveForView(
      {axis:turn.axis,layer:turn.layer,dir:turn.dir,turns:1},
      viewOrientationQ
    );

    layerDrag.oldState=oldState;
    layerDrag.newState=newState;
    layerDrag.visualMove=visualMove;
    layerDrag.dotMap=buildDragDotMap(oldState,newState,visualMove);
  } catch(err) {
    layerDrag.dotMap=null;
    console.warn('Orbit drag mapping failed',err);
  }
}

// Build mapping of dot movements for a drag: matches dots between old and new states
function shortestAngleDelta(a0,a1){
  let d=a1-a0;
  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;
  return d;
}

function orbitDirectionForPaths(rawPaths, move){
  if(move.orbitDirection) return Math.sign(move.orbitDirection) || 1;
  let positiveCost=0, negativeCost=0;
  for(const p of rawPaths){
    const d=shortestAngleDelta(p.a0,p.a1);
    positiveCost += d >= 0 ? d : d + Math.PI*2;
    negativeCost += d <= 0 ? -d : Math.PI*2 - d;
  }
  return positiveCost <= negativeCost ? 1 : -1;
}

function directedAngleDelta(a0,a1,direction){
  const tau=Math.PI*2;
  let d=a1-a0;
  if(direction>0){
    while(d<0)d+=tau;
    while(d>=tau)d-=tau;
  }else{
    while(d>0)d-=tau;
    while(d<=-tau)d+=tau;
  }
  return d;
}

// Reference behavior has two distinct face-turn paths:
// 1) 12 adjacent-strip stickers ride the active gray circle EXACTLY.
// 2) 8 stickers on the rotating face move through the radial space between
//    rings while their angle rotates around that same axis center.
// Keeping these separate prevents track stickers from visibly drifting off the
// drawn circle while preserving the measured face-perimeter motion.
function buildTrackPath(raw,direction,activeRadius){
  return {
    kind:'track',
    cx:raw.center[0],cy:raw.center[1],
    r:activeRadius,
    a0:raw.a0,
    da:directedAngleDelta(raw.a0,raw.a1,direction),
    direction
  };
}

function buildRadialPath(raw){
  return {
    kind:'radial',
    cx:raw.center[0],cy:raw.center[1],
    r0:raw.r0,r1:raw.r1,
    a0:raw.a0,
    da:shortestAngleDelta(raw.a0,raw.a1)
  };
}

function nearestOrbitRadius(r,radii){
  let best=radii[0], bestErr=Math.abs(r-radii[0]);
  for(let i=1;i<radii.length;i++){
    const err=Math.abs(r-radii[i]);
    if(err<bestErr){best=radii[i];bestErr=err;}
  }
  return {radius:best,error:bestErr};
}

function buildWholeViewPath(raw,direction,radii){
  const startRing=nearestOrbitRadius(raw.r0,radii);
  const endRing=nearestOrbitRadius(raw.r1,radii);

  // Whole-cube rotation preserves the coordinate along the active axis.
  // Therefore every moving point stays on ONE of that axis family's three
  // concentric circles for the entire transition.
  const radius=startRing.radius;
  return {
    kind:'viewTrack',
    cx:raw.center[0],cy:raw.center[1],
    r:radius,
    a0:raw.a0,
    da:directedAngleDelta(raw.a0,raw.a1,direction),
    direction,
    startRadiusError:startRing.error,
    endRadiusError:Math.abs(raw.r1-radius),
    ringConsistent:Math.abs(endRing.radius-radius)<1e-6
  };
}

function orbitPoint(m,t){
  t=Math.max(0,Math.min(1,t));
  const p=m.path;
  if(!p) return {x:m.oldX+(m.newX-m.oldX)*t,y:m.oldY+(m.newY-m.oldY)*t};

  if(p.kind==='track' || p.kind==='viewTrack'){
    // Radius is intentionally immutable. These dots are mathematically locked
    // to the centerline of the rendered gray circle for the entire motion.
    const a=p.a0+p.da*t;
    return {x:p.cx+Math.cos(a)*p.r,y:p.cy+Math.sin(a)*p.r};
  }

  if(p.kind==='radial'){
    const r=p.r0+(p.r1-p.r0)*t;
    const a=p.a0+p.da*t;
    return {x:p.cx+Math.cos(a)*r,y:p.cy+Math.sin(a)*r};
  }

  return {x:m.oldX+(m.newX-m.oldX)*t,y:m.oldY+(m.newY-m.oldY)*t};
}

function normalizedTurnProgress(angle,quarterAngle){
  if(!quarterAngle) return 0;
  return Math.max(0,Math.min(1,angle/quarterAngle));
}

function buildDragDotMap(oldIds,newIds,move){
  const slotMap=getOrbitSlotMap();
  if(!slotMap || slotMap.length!==54 || !orbitDots || orbitDots.length!==54) return null;

  const oldSlotById=new Map(), newSlotById=new Map();
  for(const {slot,globalIdx} of slotMap){
    oldSlotById.set(oldIds[globalIdx],slot);
    newSlotById.set(newIds[globalIdx],slot);
  }

  const g=getOrbitGeometry();
  const family=ORBIT_FAMILY_FOR_AXIS[move.axis];
  const center=g.centers[family];
  const raw=[];

  for(const dot of orbitDots){
    const oldSlot=oldSlotById.get(dot.id), newSlot=newSlotById.get(dot.id);
    if(!oldSlot || !newSlot) continue;
    if(Math.hypot(oldSlot.x-newSlot.x,oldSlot.y-newSlot.y)<0.01) continue;

    const x0=oldSlot.x-center[0], y0=oldSlot.y-center[1];
    const x1=newSlot.x-center[0], y1=newSlot.y-center[1];
    raw.push({
      dot,oldSlot,newSlot,center,
      r0:Math.hypot(x0,y0),
      r1:Math.hypot(x1,y1),
      a0:Math.atan2(y0,x0),
      a1:Math.atan2(y1,x1)
    });
  }

  if(move.whole){
    const direction=orbitDirectionForPaths(raw,move);
    return raw.map(p => ({
      dot:p.dot,
      oldX:p.oldSlot.x,oldY:p.oldSlot.y,
      newX:p.newSlot.x,newY:p.newSlot.y,
      path:buildWholeViewPath(p,direction,g.radii)
    }));
  }

  const ringIndex=ORBIT_COORD_TO_RING(move.layer ?? 0);
  const activeRadius=g.radii[ringIndex];
  const tolerance=Math.max(0.75,g.S*0.0035);

  // Only the 12 strip stickers are supposed to be constrained to the active
  // track. Pick their shared sweep direction as a group.
  const trackRaw=raw.filter(p =>
    Math.abs(p.r0-activeRadius)<=tolerance &&
    Math.abs(p.r1-activeRadius)<=tolerance
  );
  const trackDirection=orbitDirectionForPaths(trackRaw.length?trackRaw:raw,move);

  return raw.map(p => {
    const onTrack=
      Math.abs(p.r0-activeRadius)<=tolerance &&
      Math.abs(p.r1-activeRadius)<=tolerance;

    return {
      dot:p.dot,
      oldX:p.oldSlot.x,oldY:p.oldSlot.y,
      newX:p.newSlot.x,newY:p.newSlot.y,
      path:onTrack
        ? buildTrackPath(p,trackDirection,activeRadius)
        : buildRadialPath(p)
    };
  });
}

// Update layer drag from current pointer position
function updateLayerDrag(curX, curY){
  if (!layerDrag) return;
  const dx = curX - layerDrag.startX, dy = curY - layerDrag.startY;
  // Project drag onto the turn direction
  const dist = dx*layerDrag.dirX + dy*layerDrag.dirY;
  // 155px drag = 90 degrees. The orbit reads this exact angle on the same frame.
  const progress = Math.max(0, Math.min(1, dist / 155));
  const angle = layerDrag.dir * progress * (Math.PI/2);
  layerDrag.currentAngle = angle;
  // Direct manipulation: no secondary smoothing state. The 3D layer transform
  // is the source of truth that the orbit reads on the same frame.
  layerDrag.pivot.rotation[layerDrag.axis] = angle;
}
// Finish layer drag: snap to nearest 90deg, animate, then settle
function finishLayerDrag(){
  if (!layerDrag) return;
  const {pivot, cubies, axis, dir, currentAngle} = layerDrag;
  // Snap to nearest 90 degrees
  const dragAngle=currentAngle || 0;
  const quarterTurns = Math.abs(dragAngle) >= Math.PI/4 ? Math.sign(dragAngle) : 0;
  const targetAngle = quarterTurns * (Math.PI/2);
  const actualTurns = Math.abs(quarterTurns);
  // If snapped to 0 (no meaningful turn), just put cubies back
  if (actualTurns === 0){
    const dragOrbitMap = layerDrag.dotMap;
    const startAngle = layerDrag.pivot.rotation[axis] || currentAngle || 0;
    const returnDur=Math.max(0.10,0.50*Math.min(1,Math.abs(startAngle)/(Math.PI/2)));
    active = {pivot, cubies, axis, angle:0, t:0, dur:returnDur,
              move:{axis, layer:layerDrag.layer, dir, turns:0, duration:returnDur*1000, record:false},
              fromAngle:startAngle, isDragFinish:true, isCancelledDrag:true,
              orbitMap:dragOrbitMap, orbitStartAngle:startAngle, orbitBaseAngle:(layerDrag.pathAngle || Math.sign(startAngle||1)*Math.PI/2)};
    layerDrag = null;
    return;
  }
  // Animate from current to target, then finish as a move
  const startAngle = layerDrag.pivot.rotation[axis] || currentAngle || 0;
  const remaining=Math.abs(targetAngle-startAngle)/(Math.PI/2);
  const finishDur=Math.max(0.10,0.50*Math.min(1,remaining));
  const move = {axis, layer:layerDrag.layer, dir:Math.sign(quarterTurns), turns:actualTurns, duration:finishDur*1000, record:true};
  // Continue from the exact angle already visible on screen.
  const dragOrbitMap = layerDrag.dotMap;
  active = {pivot, cubies, axis, angle:targetAngle, t:0, dur:finishDur, move,
            fromAngle:startAngle, isDragFinish:true, orbitMap:dragOrbitMap, orbitStartAngle:startAngle, orbitBaseAngle:(layerDrag.pathAngle || targetAngle || Math.PI/2)};
  layerDrag = null;
  noteActivity();
}

/* ------------------------------- move engine ------------------------------- */

const queue = [];
let active = null;      // {pivot, cubies, axis, angle, t, dur, move}
let layerDrag = null;   // {pivot, cubies, axis, layer, dir, startX, startY, dirX, dirY} for slow-drag
const history = [];
let solving = false;    // solver playback in progress
let solverBusy = false; // solver thinking (worker)
let suppressWin = false;
let solveToken = 0;

function inputLocked(){ return solving || solverBusy; }
function busy(){ return active || layerDrag || viewDrag || viewSnap || queue.length > 0; }

function enqueueMove(m){
  // A 180° turn is two visible quarter turns in the reference. Expanding it
  // keeps every sticker on the same polar rule instead of asking one shortcut
  // interpolation to guess a half-turn path.
  if (m.turns === 2 && !m._quarterPart){
    const historyEntry = { ...m };
    queue.push({ ...m, turns:1, record:false, count:false, _quarterPart:true });
    queue.push({ ...m, turns:1, record:!!m.record, count:true, historyEntry, _quarterPart:true });
    return;
  }
  queue.push(m);
}

const _axisV = new THREE.Vector3();
const _tmpV = new THREE.Vector3();

function startMove(m){
  // Capture the physical sticker permutation before reparenting the layer.
  const oldIds = orientedStickerIds(faceletStickerIds());
  const pivot = new THREE.Group();
  cubeGroup.add(pivot);
  const cubies = [];
  for (const c of cubeGroup.children){
    if (c === pivot || !c.userData.pos) continue;
    if (Math.round(c.userData.pos[m.axis]) === m.layer) cubies.push(c);
  }
  for (const c of cubies) pivot.add(c);

  const angle = m.dir*m.turns*Math.PI/2;
  const savedActive = active;
  active = {axis:m.axis, angle, cubies};
  const newIds = orientedStickerIds(faceletStickerIds());
  active = savedActive;
  const visualMove=orientMoveForView(m,viewOrientationQ);
  const orbitMap = buildDragDotMap(oldIds,newIds,visualMove);

  active = { pivot, cubies, axis:m.axis, angle, t:0, dur:(m.duration || 500)/1000, move:m,
             orbitMap, orbitStartAngle:0 };
}

function settleCubies(cubies, angle){
  _axisV.set(0,0,0);
  _axisV[active ? active.axis : 'x'] = 1;
  const q = new THREE.Quaternion().setFromAxisAngle(_axisV, angle);
  for (const c of cubies){
    _tmpV.copy(c.userData.pos).applyQuaternion(q);
    _tmpV.set(Math.round(_tmpV.x), Math.round(_tmpV.y), Math.round(_tmpV.z));
    c.userData.pos.copy(_tmpV);
    c.position.copy(_tmpV);
    c.quaternion.premultiply(q);
    cubeGroup.add(c);
  }
}

function finishMove(){
  const finished = active;
  const { pivot, cubies, move } = finished;
  settleCubies(cubies, finished.angle);
  cubeGroup.remove(pivot);
  active = null;
  if (!finished.isCancelledDrag && move.count !== false){
    moveCount++;
    movesEl.textContent = moveCount;
    if (move.record) history.push(move.historyEntry || move);
  }
  afterMove();
}

// Instant (unanimated) turn, used by tests.
function applyInstant(m){
  const cubies = [];
  for (const c of cubeGroup.children){
    if (!c.userData.pos) continue;
    if (Math.round(c.userData.pos[m.axis]) === m.layer) cubies.push(c);
  }
  const keep = active; active = { axis:m.axis };
  settleCubies(cubies, m.dir*m.turns*Math.PI/2);
  active = keep;
  if (m.record) history.push(m);
}

function afterMove(){
  if (suppressWin){
    if (!busy()) suppressWin = false;   // scramble drained
    return;
  }
  if (!busy() && isSolved()){
    stopTimer();
    if (solving){
      solving = false;
      showWin('The solver found the way home.');
    } else {
      showWin();
    }
  }
}

const easeInOut = k => 0.5 - 0.5*Math.cos(Math.PI*k); // reference-like scripted sweep
const easeOutCubic = k => 1 - Math.pow(1-k,3);         // tactile release: no dead stop before completion

/* ------------------------------ cube state --------------------------------- */

const _n = new THREE.Vector3(), _u = new THREE.Vector3(), _r = new THREE.Vector3(), _d = new THREE.Vector3();

const _lq = new THREE.Quaternion();
// Every cubie with its logical (settled) position/orientation. While a turn is
// animating, the in-flight layer gets its pending rotation applied, so state
// readers (facelets, isSolved) stay correct mid-animation instead of crashing.
function logicalCubies(){
  const out = [];
  let sq = null;
  if (active){
    _axisV.set(0,0,0); _axisV[active.axis] = 1;
    sq = new THREE.Quaternion().setFromAxisAngle(_axisV, active.angle);
  }
  for (const c of cubeGroup.children){
    if (!c.userData.pos) continue;
    out.push({ c, pos:c.userData.pos, quat:c.quaternion });
  }
  if (active) for (const c of active.cubies){
    _tmpV.copy(c.userData.pos).applyQuaternion(sq);
    _tmpV.set(Math.round(_tmpV.x), Math.round(_tmpV.y), Math.round(_tmpV.z));
    _lq.copy(sq).multiply(c.quaternion);
    out.push({ c, pos:_tmpV.clone(), quat:_lq.clone() });
  }
  return out;
}

function facelets(){
  const cubies = logicalCubies();
  let s = '';
  for (const f of FACES){
    _n.set(...f.n); _u.set(...f.u); _r.set(...f.r);
    for (let row=0; row<3; row++) for (let col=0; col<3; col++){
      let cubie = null;
      for (const e of cubies){
        const p = e.pos;
        if (Math.round(p.dot(_n)) === 1 && Math.round(p.dot(_u)) === 1-row && Math.round(p.dot(_r)) === col-1){ cubie = e; break; }
      }
      let home = '?';
      for (const st of cubie.c.userData.stickers){
        _d.copy(st.userData.dir).applyQuaternion(cubie.quat);
        if (_d.dot(_n) > 0.9){ home = st.userData.home; break; }
      }
      s += home;
    }
  }
  return s;
}

// Stable physical-sticker permutation in the same URFDLB slot order as facelets().
function faceletStickerIds(){
  const cubies = logicalCubies();
  const ids = [];
  for (const f of FACES){
    _n.set(...f.n); _u.set(...f.u); _r.set(...f.r);
    for (let row=0; row<3; row++) for (let col=0; col<3; col++){
      let cubie = null;
      for (const e of cubies){
        const p = e.pos;
        if (Math.round(p.dot(_n)) === 1 && Math.round(p.dot(_u)) === 1-row && Math.round(p.dot(_r)) === col-1){ cubie = e; break; }
      }
      let id = -1;
      if (cubie) for (const st of cubie.c.userData.stickers){
        _d.copy(st.userData.dir).applyQuaternion(cubie.quat);
        if (_d.dot(_n) > 0.9){ id = st.userData.orbitId; break; }
      }
      ids.push(id);
    }
  }
  return ids;
}

function isSolved(){
  const s = facelets();
  for (let i=0; i<6; i++){
    const block = s.slice(i*9, i*9+9);
    if (!block.split('').every(ch => ch === block[0])) return false;
  }
  return true;
}

/* ------------------------------ actions ------------------------------------ */

const timeEl = document.getElementById('time');
const movesEl = document.getElementById('moves');
const statusEl = document.getElementById('status');
const winEl = document.getElementById('win');
const winDetail = document.getElementById('winDetail');
let moveCount = 0;
let timerStart = 0, timerOn = false, timerId = 0;

function showStatus(msg, sticky=false){
  statusEl.textContent = msg;
  statusEl.classList.add('show');
  clearTimeout(showStatus._t);
  if (!sticky) showStatus._t = setTimeout(() => statusEl.classList.remove('show'), 4200);
}
function hideStatus(){ statusEl.classList.remove('show'); }

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}
function startTimer(){
  if (timerOn || suppressWin || solving) return;
  restartTimer();
}
function restartTimer(){
  stopTimer();
  timerOn = true; timerStart = Date.now();
  timeEl.textContent = '0:00';
  timerId = setInterval(() => timeEl.textContent = fmtTime(Date.now() - timerStart), 250);
}
function stopTimer(){ timerOn = false; clearInterval(timerId); }
function resetTimer(){ stopTimer(); timerStart = 0; timeEl.textContent = '0:00'; }
function noteActivity(){ startTimer(); }

function showWin(sub){
  const elapsed = timerStart ? fmtTime(Date.now()-timerStart) : '0:00';
  winDetail.textContent = (sub || 'Nice work.') + ' ' + elapsed + ' · ' + moveCount + ' moves.';
  winEl.classList.add('show');
}
function hideWin(){ winEl.classList.remove('show'); }

function doScramble(n=25){
  if (inputLocked() || busy()) return;
  hideWin(); hideStatus();
  history.length = 0; moveCount = 0; movesEl.textContent = '0';
  resetTimer(); solving = false;
  suppressWin = true;
  const faces = ['R','L','U','D','F','B'];
  let last = -1;
  for (let i=0; i<n; i++){
    let fi;
    do { fi = Math.floor(Math.random()*6); } while (fi === last);
    last = fi;
    const r = Math.random();
    const token = faces[fi] + (r < 0.33 ? "'" : r < 0.5 ? '2' : '');
    enqueueMove({ ...parseMove(token), duration:210, record:true });
  }
  showStatus('Scrambling…');
}

function doUndo(){
  if (inputLocked() || busy()) return;
  const m = history.pop();
  if (!m){ showStatus('Nothing to undo.'); return; }
  hideWin();
  enqueueMove({ axis:m.axis, layer:m.layer, dir:-m.dir, turns:m.turns, duration:420, record:false });
  noteActivity();
}

function doReset(){
  solveToken++;
  queue.length = 0;
  active = null;   // buildCube discards the half-animated pivot with the cubies
  solving = false; solverBusy = false; suppressWin = false;
  buildCube();
  history.length = 0; moveCount = 0; movesEl.textContent = '0';
  resetTimer(); hideWin(); hideStatus();
  showStatus('Back to a fresh cube.');
}

/* ------------------------------ solver ------------------------------------- */
// Kociemba's two-phase algorithm (via the vendored cubejs library): a guided
// search through the cube's state graph, usually about 20 moves. It runs in a
// Web Worker so the one-time table build never freezes the page.

let solverWorker = null, solverReady = false, solverWaiters = [];

function getSolver(){
  return new Promise(resolve => {
    if (solverWorker && solverReady) return resolve(solverWorker);
    solverWaiters.push(resolve);
    if (solverWorker) return;
    const base = window.__VENDOR_BASE || new URL('vendor/', document.baseURI).href;
    const src =
      "importScripts('" + base + "cube.js','" + base + "solve.js');\n" +
      "Cube.initSolver();\n" +
      "postMessage({type:'ready'});\n" +
      "onmessage=function(e){\n" +
      "  try{ postMessage({type:'solution', sol:Cube.fromString(e.data.facelets).solve()}); }\n" +
      "  catch(err){ postMessage({type:'error', message:String(err)}); }\n" +
      "};";
    try {
      solverWorker = new Worker(URL.createObjectURL(new Blob([src], { type:'text/javascript' })));
    } catch(err){ solverWorker = null; }
    if (!solverWorker){ finishWaiters(null); return; }
    solverWorker.onmessage = e => {
      if (e.data.type === 'ready'){ solverReady = true; finishWaiters(solverWorker); }
      else if (solverWaiters._solve){ const cb = solverWaiters._solve; solverWaiters._solve = null; cb(e.data.sol || ''); }
    };
    solverWorker.onerror = () => {
      if (!solverReady){ solverWorker = null; finishWaiters(null); }
      else if (solverWaiters._solve){ const cb = solverWaiters._solve; solverWaiters._solve = null; cb(''); }
    };
    function finishWaiters(w){ const ws = solverWaiters; solverWaiters = []; ws.forEach(r => r(w)); }
  });
}

function solveInWorker(faceletsStr){
  return new Promise(async resolve => {
    const w = await getSolver();
    if (!w){ // worker unavailable: solve on the main thread
      try {
        if (typeof Cube !== 'undefined'){
          Cube.initSolver();
          resolve(Cube.fromString(faceletsStr).solve());
          return;
        }
      } catch(e){}
      resolve('');
      return;
    }
    solverWaiters._solve = resolve;
    setTimeout(() => { if (solverWaiters._solve){ const cb = solverWaiters._solve; solverWaiters._solve = null; cb(''); } }, 30000);
    w.postMessage({ facelets:faceletsStr });
  });
}

async function doSolve(){
  if (inputLocked() || busy()) return;
  const token = ++solveToken;
  const s = facelets();
  if (isSolved()){ showStatus('Already solved. Give it a scramble first.'); return; }
  hideWin();
  solverBusy = true;
  showStatus(solverReady ? 'Solving…' : 'Warming up the solver (one-time setup, a few seconds)…', true);
  const sol = await solveInWorker(s);
  if (token !== solveToken) return;   // user hit reset meanwhile
  solverBusy = false;
  if (!sol || !sol.trim()){ showStatus('The solver came up empty. Try again.'); return; }
  const tokens = sol.trim().split(/\s+/);
  showStatus('Solution · ' + tokens.length + ' moves: ' + sol, true);
  solving = true;
  restartTimer();
  for (const t of tokens) enqueueMove({ ...parseMove(t), duration:460, record:false });
}

/* ------------------------------ orbit diagram ------------------------------ */
// 54 sticker dots at the intersections of 9 circles: 3 centers (triangle)
// each with 3 concentric rings. The reference shows the solved cube; dots
// sit exactly where rings from different centers cross.

const ORBIT_CSS = { U:'#ffffff', D:'#ffd500', F:'#00c853', B:'#2962ff', R:'#ff1744', L:'#ff5800' };

const orbitPanel = document.getElementById('orbitPanel');
const orbitCanvas = document.getElementById('orbit');
const otx = orbitCanvas.getContext('2d');
// Drag to pan the orbit diagram
orbitCanvas.style.cursor = 'grab';
orbitCanvas.addEventListener('pointerdown', (e) => {
  orbitDragging = true;
  orbitDragSX = e.clientX; orbitDragSY = e.clientY;
  orbitPanSX = orbitPanX; orbitPanSY = orbitPanY;
  orbitCanvas.style.cursor = 'grabbing';
  orbitCanvas.setPointerCapture(e.pointerId);
});
orbitCanvas.addEventListener('pointermove', (e) => {
  if (!orbitDragging) return;
  const scale = orbitCanvas.width / orbitCanvas.getBoundingClientRect().width;
  orbitPanX = orbitPanSX + (e.clientX - orbitDragSX) * scale;
  orbitPanY = orbitPanSY + (e.clientY - orbitDragSY) * scale;
});
const endOrbitDrag = (e) => {
  orbitDragging = false;
  orbitCanvas.style.cursor = 'grab';
};
orbitCanvas.addEventListener('pointerup', endOrbitDrag);
orbitCanvas.addEventListener('pointercancel', endOrbitDrag);
const orbitCountEl = document.getElementById('orbitCount');
const btnOrbit = document.getElementById('btnOrbit');
let orbitOn = true;

function orbitSize(){
  const r = orbitCanvas.getBoundingClientRect();
  return r.width || 232;
}

function sizeOrbitCanvas(){
  const S = orbitSize();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  orbitCanvas.width = Math.round(S * dpr);
  orbitCanvas.height = Math.round(S * dpr);
  otx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Circle-circle intersection: returns 0, 1, or 2 points
function circleIntersections(x1, y1, r1, x2, y2, r2){
  const dx = x2 - x1, dy = y2 - y1;
  const d = Math.hypot(dx, dy);
  if (d > r1 + r2 || d < Math.abs(r1 - r2) || d === 0) return [];
  const a = (r1*r1 - r2*r2 + d*d) / (2*d);
  const h2 = r1*r1 - a*a;
  if (h2 < 0) return [];
  const h = Math.sqrt(h2);
  const xm = x1 + a*dx/d, ym = y1 + a*dy/d;
  const rx = -dy*h/d, ry = dx*h/d;
  return [[xm+rx, ym+ry], [xm-rx, ym-ry]];
}

// Build the 54 slots: intersections of rings from different centers.
// Returns { slots: [{x, y, pair, side}], circles: [{x, y, r}] }
function buildOrbitSlots(S){
  // Three centers at equilateral triangle vertices
  // Scaled to fit S x S panel with margin
  const cx = S/2, cy = S/2;
  // Equilateral triangle centers
  // d decreased and r/d increased per Hans: inner clusters (yellow/green/orange)
  // need wider pairwise intersection zones, central triple-zone empty
  // Measured from the reference video. With S=320 the source is approximately:
  // center spacing 79.2px, radii 64.0 / 82.3 / 100.6px.
  const d = S * 0.2476;
  const h = d * Math.sqrt(3)/2;
  const T = [cx, cy - h*2/3];
  const L = [cx - d/2, cy + h/3];
  const R = [cx + d/2, cy + h/3];

  const radii = [S*0.2000, S*0.2572, S*0.3143];
  
  const centers = {T, L, R};
  const circles = [];
  for (const name of ['T','L','R']){
    for (const r of radii){
      circles.push({id:name + radii.indexOf(r), family:name, ring:radii.indexOf(r), x: centers[name][0], y: centers[name][1], r});
    }
  }
  
  // Compute all 54 intersections
  const slots = [];
  const pairs = [['T','L'], ['T','R'], ['L','R']];
  for (const [n1, n2] of pairs){
    const [x1, y1] = centers[n1];
    const [x2, y2] = centers[n2];
    for (let i1=0; i1<radii.length; i1++){
      for (let i2=0; i2<radii.length; i2++){
        const r1 = radii[i1], r2 = radii[i2];
        const pts = circleIntersections(x1, y1, r1, x2, y2, r2);
        for (const [x, y] of pts){
          // Determine which side of the n1-n2 line (for 6-color grouping)
          const dx = x2-x1, dy = y2-y1;
          const px = x-x1, py = y-y1;
          const cross = dx*py - dy*px;
          const side = cross > 0 ? 'A' : 'B';
          slots.push({x, y, pair: n1+n2, side, circles:[n1+i1, n2+i2]});
        }
      }
    }
  }
  return {slots, circles, centers};
}

let orbitCache = null;
let orbitSlotMap = null;
function getOrbitGeometry(){
  const S = orbitSize();
  if (!orbitCache || Math.abs(orbitCache.S - S) > 1){
    const {slots, circles, centers} = buildOrbitSlots(S);
    orbitCache = {S, slots, circles, centers, radii:[S*0.2000, S*0.2572, S*0.3143]};
  }
  return orbitCache;
}

// Map each slot to a face color for the SOLVED state.
// The 6 (pair, side) groups correspond to the 6 faces.
// Assignment matches the reference image positions.
const ORBIT_FAMILY_FOR_AXIS = {x:'R', y:'T', z:'L'};
const ORBIT_AXIS_FOR_FAMILY = {R:'x', T:'y', L:'z'};
const ORBIT_FACE_FOR_GROUP = {
  TLA:'L', TLB:'R',
  TRA:'F', TRB:'B',
  LRA:'D', LRB:'U',
};
const ORBIT_GROUP_FOR_FACE = Object.fromEntries(
  Object.entries(ORBIT_FACE_FOR_GROUP).map(([k,v]) => [v,k])
);
const ORBIT_COORD_TO_RING = v => Math.max(0,Math.min(2,1-Math.round(v)));
const ORBIT_RING_TO_COORD = ring => 1-ring;

function solvedColorForSlot(slot){
  return ORBIT_FACE_FOR_GROUP[slot.pair + slot.side] || 'U';
}

// Exact mapping from a cube facelet to the intersection of the two layer
// circles perpendicular to that sticker's normal. This is the construction
// used by the reference: Y axis on top, X lower-left, Z lower-right.
function getOrbitSlotMap(){
  if (orbitSlotMap) return orbitSlotMap;
  const {slots} = getOrbitGeometry();
  orbitSlotMap = [];

  for (let fi=0; fi<FACES.length; fi++){
    const f=FACES[fi];
    const normalAxis = f.n[0] ? 'x' : f.n[1] ? 'y' : 'z';
    const otherAxes = ['x','y','z'].filter(a => a !== normalAxis);
    const groupKey = ORBIT_GROUP_FOR_FACE[f.id];

    for (let row=0; row<3; row++) for (let col=0; col<3; col++){
      const up=1-row, right=col-1;
      const p={
        x:f.n[0] + up*f.u[0] + right*f.r[0],
        y:f.n[1] + up*f.u[1] + right*f.r[1],
        z:f.n[2] + up*f.u[2] + right*f.r[2],
      };
      const wanted=otherAxes.map(a => ORBIT_FAMILY_FOR_AXIS[a] + ORBIT_COORD_TO_RING(p[a]));
      const slot=slots.find(s =>
        (s.pair+s.side)===groupKey &&
        wanted.every(id => s.circles.includes(id))
      );
      if (!slot) throw new Error('Orbit node mapping failed for '+f.id+row+col);
      orbitSlotMap.push({slot, globalIdx:fi*9 + row*3 + col});
    }
  }
  return orbitSlotMap;
}

// Sliding dots for orbit diagram (Hans: "they should slide in the orbit not just fade")
// 54 dots, each with fixed home color, current (x,y), and target (tx,ty).
// Dots move between slots along the circles when the cube turns.
let orbitDots = null;  // Array of {home, x, y, tx, ty}
// Pan/drag the orbit diagram (Hans: "slowly drag or move it")
let orbitPanX = 0, orbitPanY = 0;
let orbitDragging = false, orbitDragSX = 0, orbitDragSY = 0, orbitPanSX = 0, orbitPanSY = 0;
function drawOrbit(){
  if (!orbitOn) return;
  const S = orbitSize();
  const {slots, circles} = getOrbitGeometry();
  otx.clearRect(0, 0, S, S);
  
  // Draw the 9 circles (with pan offset)
  otx.strokeStyle = 'rgba(70,70,70,0.42)';
  otx.lineWidth = Math.max(0.8, S*0.0022);
  for (const c of circles){
    otx.beginPath();
    otx.arc(c.x + orbitPanX, c.y + orbitPanY, c.r, 0, Math.PI*2);
    otx.stroke();
  }
  
  // Sliding dots: 54 dots with fixed colors move between slots
  const dotR = Math.max(3.5, S*0.0205);
  const slotMap = getOrbitSlotMap();
  
  // Initialize dots in solved positions (first run)
  if (!orbitDots || orbitDots.length !== 54){
    orbitDots = [];
    // Group slots by face (solved color)
    const byFace = {U:[], D:[], F:[], B:[], R:[], L:[]};
    for (const {slot, globalIdx} of slotMap){
      const face = solvedColorForSlot(slot, S);
      byFace[face].push(slot);
    }
    // Create 9 dots per face, positioned at the face's slots.
    // Cache slot identity once instead of searching the 54-node map per dot.
    const indexBySlot=new Map(slotMap.map(e=>[e.slot,e.globalIdx]));
    for (const face of ['U','D','F','B','R','L']){
      for (const slot of byFace[face]){
        const id=indexBySlot.get(slot) ?? orbitDots.length;
        orbitDots.push({id,home:face,x:slot.x,y:slot.y,tx:slot.x,ty:slot.y});
      }
    }
  }
  
  // One normalized move timeline drives both the cube and the orbit diagram.
  // Manual drags are fully reversible; queued/solver moves use the same paths.
  const motion = layerDrag && layerDrag.dotMap
    ? {
        map:layerDrag.dotMap,
        t:normalizedTurnProgress(
          layerDrag.pivot.rotation[layerDrag.axis],
          layerDrag.pathAngle || Math.PI/2
        )
      }
    : active && active.orbitMap
      ? {
          map:active.orbitMap,
          t:normalizedTurnProgress(
            active.pivot.rotation[active.axis],
            active.orbitBaseAngle || active.angle || Math.PI/2
          )
        }
      : viewDrag && viewDrag.dotMap
        ? {map:viewDrag.dotMap,t:currentViewProgress(viewDrag)}
        : viewSnap && viewSnap.dotMap
          ? {
              map:viewSnap.dotMap,
              t:normalizedTurnProgress(
                viewSnap.displayAngle,
                viewSnap.dir*Math.PI/2
              )
            }
          : null;

  if (motion){
    const t = motion.t;
    for (const m of motion.map){
      const p = orbitPoint(m, t);
      m.dot.x = m.dot.tx = p.x;
      m.dot.y = m.dot.ty = p.y;
    }
  } else {
    // Settled state: map every persistent sticker identity to its exact node.
    const ids = orientedStickerIds(faceletStickerIds());
    const slotById = new Map();
    for (const {slot, globalIdx} of slotMap) slotById.set(ids[globalIdx], slot);
    for (const dot of orbitDots){
      const slot = slotById.get(dot.id);
      if (slot){ dot.tx = slot.x; dot.ty = slot.y; }
    }
  }

  // Exact path motion lands directly on orbit nodes. There is intentionally no
  // post-move catch-up lerp: that was the source of the visible snap.
  for (const dot of orbitDots){
    if (!motion){ dot.x = dot.tx; dot.y = dot.ty; }
    otx.fillStyle = ORBIT_CSS[dot.home] || '#888';
    otx.strokeStyle = 'rgba(35,32,26,0.6)';
    otx.lineWidth = Math.max(0.8, S*0.002);
    otx.beginPath();
    otx.arc(dot.x + orbitPanX, dot.y + orbitPanY, dotR, 0, Math.PI*2);
    otx.fill();
    otx.stroke();
  }
  
  orbitCountEl.textContent = '54 stickers';
}

btnOrbit.addEventListener('click', () => {
  orbitOn = !orbitOn;
  btnOrbit.setAttribute('aria-pressed', String(orbitOn));
  orbitPanel.classList.toggle('hidden', !orbitOn);
  if (orbitOn){
    orbitCache = null; orbitSlotMap = null; orbitDots = null;
    sizeOrbitCanvas();
    drawOrbit();
  }
});

/* --------------------------------- loop ------------------------------------ */

let lastT = performance.now();
// Fit the whole cube in frame on any aspect ratio: widen the distance on
// narrow portrait screens, keep the composed distance on desktop.
function fitZoom(){
  const a = stage.clientWidth / Math.max(1, stage.clientHeight);
  return Math.min(22, 10.5 * Math.max(1, 1.26/a));
}
function resize(){
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  sizeOrbitCanvas();
}
window.addEventListener('resize', resize);

function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;

  yaw += (targetYaw - yaw) * 0.07;
  pitch += (targetPitch - pitch) * 0.07;
  zoomFactor += (targetZoomFactor - zoomFactor) * 0.1;

  if (viewSnap){
    viewSnap.t += dt;
    const k=Math.min(1,viewSnap.t/viewSnap.dur);
    viewSnap.displayAngle=viewSnap.startAngle+
      (viewSnap.targetAngle-viewSnap.startAngle)*easeOutCubic(k);
    if(k>=1){
      if(viewSnap.commit){
        viewOrientationQ.copy(viewSnap.targetQ);
        viewSlotPermutation=viewSnap.targetPerm;
      }
      viewSnap=null;
    }
  }

  // Compose the fixed isometric presentation with the user's exact cube
  // orientation. During a view drag the 3D cube and 2D orbit read the same
  // angle, just like a face-layer drag.
  _baseViewEuler.set(pitch,yaw,0,'XYZ');
  _baseViewQ.setFromEuler(_baseViewEuler);
  _displayOrientationQ.copy(viewOrientationQ);
  if(viewDrag){
    axisQuaternion(viewDrag.axis,viewDrag.angle,_stepViewQ);
    _displayOrientationQ.multiply(_stepViewQ);
  } else if(viewSnap){
    axisQuaternion(viewSnap.axis,viewSnap.displayAngle,_stepViewQ);
    _displayOrientationQ.multiply(_stepViewQ);
  }
  viewGroup.quaternion.copy(_baseViewQ).multiply(_displayOrientationQ);

  const wideComposition = stage.clientWidth >= 760;
  viewGroup.position.x += ((wideComposition ? 2.35 : 0) - viewGroup.position.x) * 0.08;
  camera.position.set(0, 0.7, fitZoom() * zoomFactor);
  camera.lookAt(0, 0, 0);

  if (active){
    active.t += dt;
    const k = Math.min(1, active.t / active.dur);
    // For drag-finish, interpolate from fromAngle to angle
    const eased = active.isDragFinish ? easeOutCubic(k) : easeInOut(k);
    let displayedAngle;
    if (active.fromAngle !== undefined){
      displayedAngle = active.fromAngle + (active.angle - active.fromAngle) * eased;
    } else {
      displayedAngle = active.angle * eased;
    }
    active.pivot.rotation[active.axis] = displayedAngle;

    // The orbit reads this exact pivot rotation later in the same frame.
    if (k >= 1) finishMove();
  } else if (queue.length){
    startMove(queue.shift());
  }

  renderer.render(scene, camera);
  drawOrbit();
}

resize();
sizeOrbitCanvas();
drawOrbit();
showStatus('Drag a sticker to turn a layer. Drag the background to change faces.');
requestAnimationFrame(loop);

/* ------------------------------- debug API --------------------------------- */
window.__cube = {
  move(notation, instant=true){
    for (const t of notation.trim().split(/\s+/)){
      if (!t) continue;
      const m = { ...parseMove(t), record:true };
      if (instant) applyInstant(m); else enqueueMove({ ...m, duration:500 });
    }
    moveCount += 0;
  },
  facelets, isSolved,
  orbit: () => ({
    on:orbitOn,
    dots:orbitDots ? orbitDots.length : 0,
    activePaths:(layerDrag?.dotMap || active?.orbitMap || viewDrag?.dotMap || viewSnap?.dotMap || [])
      .map(m => ({path:m.path?.kind || 'line', direction:Math.sign(m.path?.da || 0)})),
    pathCounts:(layerDrag?.dotMap || active?.orbitMap || viewDrag?.dotMap || viewSnap?.dotMap || [])
      .reduce((a,m)=>{const k=m.path?.kind||'line';a[k]=(a[k]||0)+1;return a;},{})
  }),
  syncState(){
    if(viewDrag){
      const p=currentViewProgress(viewDrag);
      return {mode:'view-drag',angle:viewDrag.angle,cubeProgress:p,orbitProgress:p};
    }
    if(viewSnap){
      const p=Math.max(0,Math.min(1,viewSnap.displayAngle/(viewSnap.dir*Math.PI/2)));
      return {mode:'view-snap',angle:viewSnap.displayAngle,cubeProgress:p,orbitProgress:p};
    }
    if (layerDrag){
      const angle=layerDrag.pivot.rotation[layerDrag.axis];
      const denom=layerDrag.pathAngle || Math.PI/2;
      const p=normalizedTurnProgress(angle,denom);
      return {mode:'drag', angle, cubeProgress:p, orbitProgress:p};
    }
    if (active){
      const angle=active.pivot.rotation[active.axis];
      const denom=active.orbitBaseAngle || active.angle || Math.PI/2;
      const p=normalizedTurnProgress(angle,denom);
      return {mode:'active', angle, cubeProgress:p, orbitProgress:p};
    }
    return {mode:'idle', cubeProgress:0, orbitProgress:0};
  },
  validateOrbit(){
    if (!orbitDots || orbitDots.length !== 54) return {ok:false, reason:'orbit not initialized'};
    const oldIds=orientedStickerIds(faceletStickerIds());
    const out={};
    const savedActive=active;
    for (const [name,m0] of Object.entries(MOVES)){
      const cubies=[];
      for (const c of cubeGroup.children){
        if (c.userData.pos && Math.round(c.userData.pos[m0.axis])===m0.layer) cubies.push(c);
      }
      const m={...m0,turns:1};
      active={axis:m.axis,angle:m.dir*Math.PI/2,cubies};
      const newIds=orientedStickerIds(faceletStickerIds());
      active=savedActive;
      const visualMove=orientMoveForView(m,viewOrientationQ);
      const paths=buildDragDotMap(oldIds,newIds,visualMove) || [];
      const counts=paths.reduce((a,p)=>{const k=p.path?.kind||'none';a[k]=(a[k]||0)+1;return a;},{});
      const directions=[...new Set(
        paths.filter(p=>p.path?.kind==='track' || p.path?.kind==='viewTrack')
          .map(p=>Math.sign(p.path?.da||0)).filter(Boolean)
      )];
      out[name]={
        moving:paths.length,paths:counts,axis:visualMove.axis,dir:visualMove.dir,
        orbitDirections:directions,directionCoherent:directions.length<=1
      };
    }
    active=savedActive;
    return {
      ok:Object.values(out).every(x=>
        x.moving===20 && x.paths.track===12 && x.paths.radial===8 && x.directionCoherent
      ),
      moves:out
    };
  },
  validateView(){
    if (!orbitDots || orbitDots.length !== 54) return {ok:false, reason:'orbit not initialized'};
    const oldIds=orientedStickerIds(faceletStickerIds());
    const out={};
    for (const visualAxis of ['x','y']){
      for (const desiredDir of [-1,1]){
        const local=localAxisForVisualAxis(visualAxis,desiredDir);
        axisQuaternion(local.axis,local.dir*Math.PI/2,_stepViewQ);
        const targetQ=viewOrientationQ.clone().multiply(_stepViewQ);
        const targetPerm=buildViewSlotPermutation(targetQ);
        const newIds=orientedStickerIds(faceletStickerIds(),targetPerm);
        const visualMove=orientMoveForView(
          {axis:local.axis,dir:local.dir,turns:1,whole:true},
          viewOrientationQ
        );
        const paths=buildDragDotMap(oldIds,newIds,visualMove) || [];
        const counts=paths.reduce((a,p)=>{const k=p.path?.kind||'none';a[k]=(a[k]||0)+1;return a;},{});
        const directions=[...new Set(paths.map(p=>Math.sign(p.path?.da||0)).filter(Boolean))];
        const maxRadiusError=paths.reduce((mx,p)=>Math.max(
          mx,
          p.path?.startRadiusError || 0,
          p.path?.endRadiusError || 0
        ),0);
        const ringsConsistent=paths.every(p=>p.path?.ringConsistent!==false);
        out[visualAxis+(desiredDir>0?'+':'-')]={
          moving:paths.length,paths:counts,
          orbitDirections:directions,directionCoherent:directions.length<=1,
          maxRadiusError,ringsConsistent
        };
      }
    }
    return {
      ok:Object.values(out).every(x=>
        x.moving===52 && x.paths.viewTrack===52 && x.directionCoherent &&
        x.ringsConsistent && x.maxRadiusError<0.05
      ),
      turns:out
    };
  },
  orbitDotCount(){
    let n = 0;
    for (const c of cubeGroup.children) if (c.userData.pos) n += c.userData.stickers.length;
    if (active) for (const c of active.cubies) n += c.userData.stickers.length;
    return n;
  },
  scramble: n => doScramble(n),
  reset: () => doReset(),
  applySolution(sol){ for (const t of sol.trim().split(/\s+/)){ if (t) applyInstant({ ...parseMove(t), record:false }); } },
  solveNow: async () => await solveInWorker(facelets()),
  cubejsCheck: seq => new Cube().move(seq).asString(),
  stickerScreenPos(faceId, row, col){
    const f = FACES.find(f => f.id === faceId);
    const n = new THREE.Vector3(...f.n), u = new THREE.Vector3(...f.u), r = new THREE.Vector3(...f.r);
    for (const e of logicalCubies()){
      const p = e.pos;
      if (Math.round(p.dot(n)) === 1 && Math.round(p.dot(u)) === 1-row && Math.round(p.dot(r)) === col-1){
        const st = e.c.userData.stickers.find(s => s.userData.home === faceId);
        const v = new THREE.Vector3();
        st.getWorldPosition(v).project(camera);
        const rect = canvas.getBoundingClientRect();
        return { x: rect.left + (v.x+1)/2*rect.width, y: rect.top + (1-v.y)/2*rect.height };
      }
    }
    return null;
  },
  view: () => ({
    yaw,pitch,
    orientation:[viewOrientationQ.x,viewOrientationQ.y,viewOrientationQ.z,viewOrientationQ.w],
    dragging:!!viewDrag,snapping:!!viewSnap
  }),
  state: () => ({ queue:queue.length, active:!!active, history:history.length }),
  dbg: () => ({ queue:queue.length, active:!!active, t:active&&+active.t.toFixed(3),
    dur:active&&active.dur, cubies:cubeGroup.children.filter(c=>c.userData.pos).length,
    pivots:cubeGroup.children.filter(c=>!c.userData.pos).length }),
};
</script>
